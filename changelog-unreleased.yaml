#@formatter:off
# Release notes for the next release. Written for the user: describe what changes for them, not
# how it was implemented. Reference GitHub issues with "See #1234".
# Allowed types: fix, feature, features, note.
# Use HTML entities (&quot;, &apos;) instead of literal quotes inside the text.
#
# Example:
# -   type: "fix"
#     text: "Searching no longer takes forever. See #1234"
#
# misc/build_and_release.py moves these entries into core/src/main/resources/changelog.yaml when
# a release is built. Never add them to changelog.yaml by hand.
-   type: "fix"
    text: "Testing a downloader connection no longer fails with an API key error when the saved API key, username or password were left at &quot;Value unchanged&quot;. See #1098"
-   type: "fix"
    text: "Backups now store passwords and API keys obfuscated, like the main config file. Backups made by older versions can still be restored."
-   type: "fix"
    text: "The Emby API key is no longer sent to the browser of users who are not admins."
-   type: "fix"
    text: "Saving the config after deleting, adding and renaming users, indexers or downloaders in one go could give one of them the saved password or API key of another. Each one now keeps its own. Testing the connection or checking the capabilities of an indexer or downloader you just renamed also uses its own saved credentials, and asks you to enter them again instead of sending a placeholder if they can&apos;t be found."
