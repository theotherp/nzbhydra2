#@formatter:off
# Release notes for the next release. Written for the user: describe what changes for them, not
# how it was implemented. Reference GitHub issues with "See #1234".
# Allowed types: fix, feature, features, note.
# Use HTML entities (&quot;, &apos;) instead of literal quotes inside the text.
#
# Example:
# -   type: "fix"
#     text: "Searching no longer takes forever. See #1234"
#
# misc/build_and_release.py moves these entries into core/src/main/resources/changelog.yaml when
# a release is built. Never add them to changelog.yaml by hand.
-   type: "fix"
    text: "TorBox: The download queue and status no longer fail to load when TorBox doesn&apos;t send some values for older downloads."
-   type: "fix"
    text: "TorBox: Expired downloads are shown as finished instead of staying in the downloader queue forever."
-   type: "fix"
    text: "&quot;Send selected to downloader&quot; now works when the downloader&apos;s categories can&apos;t be loaded but a default category is configured, e.g. when SABnzbd is set up with its add-only NZB key. See #1121"
-   type: "fix"
    text: "API searches no longer fail with a database error when a program like AIOStreams requests several pages of the same search at once."
