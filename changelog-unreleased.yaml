#@formatter:off
# Release notes for the next release. Written for the user: describe what changes for them, not
# how it was implemented. Reference GitHub issues with "See #1234".
# Allowed types: fix, feature, features, note.
# Use HTML entities (&quot;, &apos;) instead of literal quotes inside the text.
#
# Example:
# -   type: "fix"
#     text: "Searching no longer takes forever. See #1234"
#
# misc/build_and_release.py moves these entries into core/src/main/resources/changelog.yaml when
# a release is built. Never add them to changelog.yaml by hand.
-   type: "fix"
    text: "Results from NZBKing and Binsearch are now recognized as duplicates of the same release from other indexers. NZBKing only shows rounded sizes and both only show the age in days, which kept them apart, so a NZBKing result could lead a title group instead of the result from the indexer with the higher priority."
-   type: "note"
    text: "The wrappers now starts Java with -XX:-UseBASE64Intrinsics, which protects against the Java4Shell vulnerability (CVE-2026-114938) on CPUs with AVX-512 even before your Java is updated. This concerns the generic release that runs with your own Java installation, not the Linux and Windows executables. Please update Java as soon as possible. "
-   type: "fix"
    text: "While we're at it, fixed several problems of the Windows wrappers (NZBHydra2.exe and NZBHydra2 Console.exe)"
-   type: "fix"
    text: "The recent searches dropdown now opens quickly even with a long search history."
