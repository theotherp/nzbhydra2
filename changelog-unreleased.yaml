#@formatter:off
# Release notes for the next release. Written for the user: describe what changes for them, not
# how it was implemented. Reference GitHub issues with "See #1234".
# Allowed types: fix, feature, features, note.
# Use HTML entities (&quot;, &apos;) instead of literal quotes inside the text.
#
# Example:
# -   type: "fix"
#     text: "Searching no longer takes forever. See #1234"
#
# misc/build_and_release.py moves these entries into core/src/main/resources/changelog.yaml when
# a release is built. Never add them to changelog.yaml by hand.
-   type: "fix"
    text: "The indexer statuses page is much more compact on phones: each indexer shows its name and a colored state badge on one line and hides empty fields. The state badge also makes problem indexers easier to spot on desktop."
-   type: "feature"
    text: "Due to popular demand: The indexer statuses view in the search results is back. It starts collapsed, remembers whether you expanded it, and can be hidden in the Display menu. While it is hidden, the number of failed indexers is still shown next to the result count. Users who may not see the indexer selection don&apos;t see it either."
-   type: "fix"
    text: "The search history is much more compact on phones: each search shows its query first, category and time on one line with the Details and Repeat buttons, and its parameters below. About five searches now fit on a screen instead of two."
-   type: "fix"
    text: "The download history is much more compact on phones: each download shows its title with the NZB button first, then its result, indexer, time and age on one line."
-   type: "feature"
    text: "The Category and Details columns of the search results can now be hidden in the Display menu. Hiding a column also hides its filter in the Refine sidebar. Your choice is remembered."
-   type: "feature"
    text: "When the movie quality indicator is enabled, the quality rating now has its own column left of the title. You can sort by it (unrated results always come last) and filter by a minimum and maximum rating in the Refine sidebar."
-   type: "feature"
    text: "The quick filters that used to be built in (CAM / TS, WEB, 1080p, x265 and so on) are now regular quick filters in Config &gt; Searching, so you can change or delete them. Your existing quick filters are kept and listed after them. Put a group name in front of a filter&apos;s name, like Resolution:1080p=1080p, to show results matching any of the selected filters in that group. The search results sort quick filters by group, with ungrouped ones last."
-   type: "feature"
    text: "List settings in the config (quick filters, forbidden words, user agents and so on) can be edited in place: click an entry, change it and press Enter. Escape cancels."
-   type: "feature"
    text: "The browser tab now names the page you are on, e.g. &quot;NZBHydra 2 - Config - Searching&quot;, &quot;NZBHydra 2 - History - Downloads&quot; or &quot;NZBHydra 2 - Search - your query&quot;, instead of always &quot;NZBHydra 2&quot;."
-   type: "feature"
    text: "New setting &quot;Show indexer groups in separate section&quot; in Config &gt; Main &gt; UI. When indexer groups are configured, the search page shows a button for each group to the right of the indexer selection, so you can select a group with one click instead of going through the selection menu. The button of the currently selected group is highlighted."
