#@formatter:off
# Release notes for the next release. Written for the user: describe what changes for them, not
# how it was implemented. Reference GitHub issues with "See #1234".
# Allowed types: fix, feature, features, note.
# Use HTML entities (&quot;, &apos;) instead of literal quotes inside the text.
#
# Example:
# -   type: "fix"
#     text: "Searching no longer takes forever. See #1234"
#
# misc/build_and_release.py moves these entries into core/src/main/resources/changelog.yaml when
# a release is built. Never add them to changelog.yaml by hand.
-   type: "fix"
    text: "A custom icon configured for a downloader is shown again on the search results&apos; send buttons. Icons are now taken from Font Awesome 5; the downloader config links to its free icon collection."
-   type: "fix"
    text: "Searches no longer fail with &quot;Numeric value out of range&quot; once the database has stored more than about two billion search result entries over its lifetime. Probably not something that would ever happen to you but who knows, I've learned not to underestimate how many indexers some of you have configured or how many searches you do. See #1111"
-   type: "fix"
    text: "An indexer&apos;s results could be lost, and the indexer temporarily disabled, when it returned the same result twice in one response or when the config was saved while a search was running. See #1112"
-   type: "fix"
    text: "Changing the search results page after scrolling down now takes you back to the top of the new page instead of leaving you at its bottom. See #1110"
-   type: "feature"
    text: "With many result pages the page links below the results show more pages on wide screens and a &quot;Jump to page&quot; selection takes you directly to any page. See #1110"
-   type: "fix"
    text: "The last search result on a page is no longer partly hidden behind the downloader status bar at the bottom. See #1114"
-   type: "fix"
    text: "With access restricted, users who aren&apos;t logged in could still receive the downloader status, search progress and notifications. They now only go to users allowed to search (downloader status, search progress) or to admins (notifications). The login page also no longer shows the downloader status or any other footer."
-   type: "fix"
    text: "Security: a crafted link could run script in NZBHydra2 when an error message was shown, which could be used to take over a logged-in admin session. Error responses no longer echo request parameters and no longer contain stack traces."
-   type: "fix"
    text: "Security: the history filters and sorting accepted arbitrary database expressions, which let anyone with stats access read data they shouldn&apos;t. Filters and sort columns are now checked strictly; invalid ones are rejected. The legacy /api/history endpoints now reject page sizes above 1000."
-   type: "fix"
    text: "Security: the image proxy (&quot;Proxy images&quot;) could be used by anyone to fetch arbitrary URLs from the NZBHydra2 server, including addresses in your local network. It now only fetches cover and poster images NZBHydra2 itself linked, only returns images and requires search access. Proxied image links from before a restart stop working; search again to get new ones."
-   type: "fix"
    text: "Security: the internal key-value storage could be read and changed without logging in. Only the few values the web interface needs are accessible now, each only to users with the matching rights."
-   type: "fix"
    text: "Security: every web endpoint now needs an explicit access rule, so endpoints that were accidentally left open are closed (e.g. search autocomplete, user preferences and a debug page). Endpoints added in the future can no longer be left open by mistake."
-   type: "fix"
    text: "Security: users who aren&apos;t logged in could see the recent searches of all users on the search page, or those of a specific user. With authentication configured they now see none; without authentication nothing changes."
-   type: "fix"
    text: "Security: the protection against password guessing (blocking after five failed logins) could be bypassed by sending a fake client address, and could be used to block other users. It now only trusts forwarded client addresses from reverse proxies in your local network, and it now actually applies to form and basic auth logins. If your reverse proxy has a public IP address all users behind it count as one client for this protection."
