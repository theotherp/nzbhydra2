#@formatter:off
# Release notes for the next release. Written for the user: describe what changes for them, not
# how it was implemented. Reference GitHub issues with "See #1234".
# Allowed types: fix, feature, features, note.
# Use HTML entities (&quot;, &apos;) instead of literal quotes inside the text.
#
# Example:
# -   type: "fix"
#     text: "Searching no longer takes forever. See #1234"
#
# misc/build_and_release.py moves these entries into core/src/main/resources/changelog.yaml when
# a release is built. Never add them to changelog.yaml by hand.
-   type: "fix"
    text: "The search progress dialog now counts indexer queries instead of claiming more indexers were searched than selected. One indexer may be queried several times to load more results."
-   type: "fix"
    text: "When no loaded result passed your filters (e.g. a minimum age on a broad query) the search page now says so and lists the rejection reasons instead of showing &quot;invalid paging cursor&quot;."
-   type: "fix"
    text: "&quot;Load all&quot; stops at a number of results that depends on the XMX value (about 10,000 for 256MB, 40,000 for 1024MB). Loading more could run Hydra out of memory and break its database until a restart."
-   type: "fix"
    text: "On Windows the wrapper ignored the XMX, logGc and custom VM options values from the main config and always started Hydra with 256MB. Requires a new wrapper."
-   type: "fix"
    text: "A running search, including &quot;Load all&quot;, is stopped on the server when you start a new search, cancel it, leave the search page or close the browser tab. Before, it kept loading results in the background."
