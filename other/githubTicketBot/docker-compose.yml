services:
    githubticketbot:
        build: .
        image: githubticketbot:latest
        restart: unless-stopped
        env_file:
            - .env
        # Container paths; these take precedence over the same keys in .env,
        # so a .env written for a non-docker run still works here.
        environment:
            BOT_STATE_FILE: /data/state.json
            BOT_GITHUB_APP_PRIVATE_KEY_FILE: /secrets/app.pem
        volumes:
            - ./state:/data
            # The host path of the key comes from BOT_GITHUB_APP_PRIVATE_KEY_FILE in
            # .env (relative to this directory). Long syntax so a wrong path fails
            # instead of Docker silently creating an empty directory in its place.
            -   type: bind
                source: ${BOT_GITHUB_APP_PRIVATE_KEY_FILE:?set BOT_GITHUB_APP_PRIVATE_KEY_FILE in .env}
                target: /secrets/app.pem
                read_only: true
                bind:
                    create_host_path: false
