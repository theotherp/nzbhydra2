networks:
    systemtest:
        external: true
services:
    mockserver:
        image: ghcr.io/theotherp/mockserver:3.1.0
        container_name: mockserver
        ports:
            - "5080:5080"
        environment:
            - spring_profiles_active=build,systemtest
        networks: [ "systemtest" ]
        restart: unless-stopped
    sonarr:
        image: lscr.io/linuxserver/sonarr:latest
        container_name: sonarr
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/London
            - SONARR__APIKEY=system-test-api-key-12345
        volumes:
            - ../../sonarr/data:/config
        ports:
            - "18989:8989"
        extra_hosts:
          - "host.docker.internal:host-gateway"
        networks: [ "systemtest" ]
        restart: unless-stopped
    radarr:
        image: lscr.io/linuxserver/radarr:latest
        container_name: radarr
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/London
            - RADARR__APIKEY=system-test-api-key-12345
        volumes:
            - ../../radarr/data:/config
        ports:
            - "7878:7878"
        extra_hosts:
          - "host.docker.internal:host-gateway"
        networks: [ "systemtest" ]
        restart: unless-stopped
    core:
        depends_on:
            - mockserver
        image: ${HYDRA_IMAGE:-ghcr.io/theotherp/hydradocker:latest}
        container_name: core
        ports:
            - "5076:5076"
        environment:
            - spring_profiles_active=build,systemtest
        volumes:
            - /tmp/hydra/defaultDataFolder:/data
            - /tmp/hydraBlackhole_core:/hydraBlackhole
        networks: [ "systemtest" ]
        restart: unless-stopped
