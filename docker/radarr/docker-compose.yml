---
services:
    radarr:
        image: ghcr.io/linuxserver/radarr:latest
        container_name: radarr_test
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/London
        volumes:
            - ./data:/config
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - 7878:7878
