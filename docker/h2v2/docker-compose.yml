services:
    nzbhydra2:
        image: lscr.io/linuxserver/nzbhydra2:latest
        container_name: nzbhydra2
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Etc/UTC
        volumes:
            - .//data:/config
            - ./downloads:/downloads #optional
        ports:
            - 127.0.0.1:${H2V2_PORT:-5076}:5076
        # "no" so that the instance stays down after MigrationFixtureTool shuts it down and the database file can be copied
        restart: "no"
        extra_hosts:
            # Rootless docker cannot reach the host through host-gateway; export SYSTEMTEST_HOST_ADDRESS=<host LAN IP>
            - "host.docker.internal:${SYSTEMTEST_HOST_ADDRESS:-host-gateway}"
