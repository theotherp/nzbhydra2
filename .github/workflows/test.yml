name: Java CI

on: [ workflow_dispatch ]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test with Maven
        run: mvn --batch-mode --update-snapshots verify
