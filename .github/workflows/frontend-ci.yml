name: Frontend CI

on:
  push:
  pull_request:

jobs:
  react-quality:
    name: React quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/ui-react
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: core/ui-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run

      - name: Build production assets
        run: npm run build

      - name: Validate production assets
        run: npm run validate:production-assets
