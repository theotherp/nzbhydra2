name: Frontend CI

on:
  push:
  pull_request:

jobs:
  react-quality:
    name: React quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    defaults:
      run:
        working-directory: core/ui-react
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: core/ui-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run

      - name: Convert unit test results to CTRF
        if: always()
        run: npx --yes junit-to-ctrf test-results/vitest-junit.xml -o ctrf/vitest-report.json -t "React Unit Tests (Vitest)"

      - name: Publish test report
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: 'core/ui-react/ctrf/*.json'
          title: 'React Unit Tests'
          summary-report: true
          insights-report: true
          flaky-rate-report: true
          slowest-report: true
          fail-rate-report: true
          upload-artifact: true
          artifact-name: 'ctrf-report-react-unit'
          fetch-previous-results: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production assets
        run: npm run build

      - name: Validate production assets
        run: npm run validate:production-assets
