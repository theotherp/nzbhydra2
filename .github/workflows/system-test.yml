name: system-test

on:
  push:
  workflow_dispatch:

concurrency:
  group: system-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  waitForNative:
    uses: ./.github/workflows/buildNative.yml
  buildMockserver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: "Check out source"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push mockserver container"
        run: |
          mvn --batch-mode install -DskipTests -T 1C
          cd other/mockserver/
          mvn --batch-mode spring-boot:build-image
          docker tag mockserver:3.1.0 ghcr.io/theotherp/mockserver:3.1.0
          docker push ghcr.io/theotherp/mockserver:3.1.0

  runSystemTestsLinux:
    needs: [ waitForNative, buildMockserver ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      spring_profiles_active: build,systemtest,testdocker,core
      nzbhydra_port: 5076
      nzbhydra.port: 5076
      nzbhydra_name: core
      NZBHYDRANAME: core
      nzbhydra.name: core
      HYDRA_IMAGE: ghcr.io/theotherp/hydradocker:${{ github.sha }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5076
      HYDRA_INTERNAL_API_KEY: internalApiKey
      HYDRA_EXTERNAL_URL: http://core:5076
      MOCKSERVER_EXTERNAL_URL: http://127.0.0.1:5080
      MOCKSERVER_INTERNAL_URL: http://mockserver:5080
      RADARR_INTERNAL_URL: http://radarr:7878
      RADARR_EXTERNAL_URL: http://127.0.0.1:7878
      RADARR_API_KEY: system-test-api-key-12345
      SONARR_PRESET_URL: http://localhost:18989
      SONARR_INTERNAL_URL: http://sonarr:8989
      SONARR_EXTERNAL_URL: http://127.0.0.1:18989
      SONARR_API_KEY: system-test-api-key-12345
      SABNZBD_MOCK_API_KEY: deterministic-sabnzbd-key
    steps:
      - run: echo Running test core with port 5076
      - uses: actions/checkout@v4
        name: "Check out source"

      - name: Set artifact timestamp
        run: printf 'ARTIFACT_TIMESTAMP=%s\n' "$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/system/package-lock.json

      - name: Install Playwright dependencies
        working-directory: tests/system
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: "Install maven"
        run: mvn --batch-mode clean install -DskipTests -pl org.nzbhydra:nzbhydra2,org.nzbhydra:shared,org.nzbhydra:mapping,org.nzbhydra:release-parser

      - name: "Create docker network"
        run: docker network create systemtest

      - name: "Run docker compose"
        run: |
          cd docker/docker-compose-systemtest/linux
          if ! docker compose up --quiet-pull -d; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi
          cd ../../..

      - name: "Wait for healthy containers"
        run: |
          wait_for_arr() {
            local name="$1"
            local port="$2"
            for attempt in {1..30}; do
              if curl --fail --silent --show-error --header "X-Api-Key: system-test-api-key-12345" "http://127.0.0.1:${port}/api/v3/system/status" > /dev/null; then
                echo "${name} is ready"
                return
              fi
              sleep 2
            done
            echo "${name} did not become ready"
            docker compose logs --no-color "${name}"
            exit 1
          }

          docker ps
          wait_for_arr sonarr 18989
          wait_for_arr radarr 7878
          docker ps
          echo "Core container mounts:"
          docker container inspect -f '{{ .Mounts}}' core
      - name: "Curl core"
        run: "curl --verbose http://127.0.0.1:5076"

      - name: "Run tests"
        run: mvn --batch-mode test -pl org.nzbhydra.tests:system -DtrimStackTrace=false

      - name: "Run Playwright system tests"
        working-directory: tests/system
        run: npm run test:full

      - name: "Test GUI runner safety"
        run: python3 -m unittest misc/test_run_gui_systemtest.py

      - name: "Upload Playwright artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test--linux-native--core--playwright--${{ env.ARTIFACT_TIMESTAMP }}
          path: |
            tests/system/playwright-report/**
            tests/system/test-results/**
          if-no-files-found: warn

      - name: "Write docker-compose logs"
        if: always()
        run: |
          cd docker/docker-compose-systemtest/linux
          echo "Writing docker compose logs to files"
          docker compose logs --no-color radarr > docker-compose-radarr.log
          docker compose logs --no-color sonarr > docker-compose-sonarr.log
          docker compose logs --no-color mockserver > docker-compose-mockserver.log
          docker compose logs --no-color core > docker-compose-core.log
          echo "Found log files:"
          find . -name "*.log"
          cd ../../..

      - name: "Truncate large log files"
        if: always()
        # If the logs are larger than 1MB there's probably something wrong
        run: |
          shopt -s globstar
          for d in ./**/*.log; do
            if [ -f "$d" ] && [ "$(stat -c%s "$d")" -gt 1048576 ]; then
              truncate --size=1M "$d"
            fi
          done

      - name: "Check logs for unwanted strings"
        if: always()
        run: |
          # Add unwanted strings to this list (one per line)
          UNWANTED_STRINGS=(
            "Missing[A-Za-z]*Registration"
            "Unable to complete startup initialization"
          )

          FOUND_ISSUES=0
          for pattern in "${UNWANTED_STRINGS[@]}"; do
            echo "Searching for: $pattern"
            matches=$(grep -rHn "$pattern" docker/docker-compose-systemtest/linux/*.log /tmp/hydra/**/*.log 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "::error::Found unwanted string '$pattern' in logs:"
              echo "$matches" | while read -r line; do
                file=$(echo "$line" | cut -d: -f1)
                linenum=$(echo "$line" | cut -d: -f2)
                content=$(echo "$line" | cut -d: -f3-)
                echo "  File: $file"
                echo "  Line $linenum: $content"
                # Show next 5 lines for context
                tail -n +$((linenum + 1)) "$file" 2>/dev/null | head -n 5 | while read -r ctx; do
                  echo "    $ctx"
                done
              done
              FOUND_ISSUES=1
            fi
          done

          if [ $FOUND_ISSUES -eq 1 ]; then
            echo "::error::Unwanted strings found in log files. See above for details."
            exit 1
          fi
          echo "No unwanted strings found in logs"

      - name: "Upload data folder artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test--linux-native--core--data-folder--${{ env.ARTIFACT_TIMESTAMP }}
          path: /tmp/hydra

      - name: "Upload test logs artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test--linux-native--core--test-logs--${{ env.ARTIFACT_TIMESTAMP }}
          path: |
            tests/**/*.log
            tests/**/target/surefire-reports/**

      - name: "Upload docker logs artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test--linux-native--core--docker-logs--${{ env.ARTIFACT_TIMESTAMP }}
          path: docker/docker-compose-systemtest/linux/*.log

      - name: "Create test Report"
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: System test report core ${{ github.sha }}
          path: "**/surefire-reports/*.xml"
          reporter: java-junit

  runSystemTestsJvmCoverage:
    needs: buildMockserver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      spring_profiles_active: build,systemtest,testdocker,core
      nzbhydra_port: 5076
      nzbhydra.port: 5076
      nzbhydra_name: core
      NZBHYDRANAME: core
      nzbhydra.name: core
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5076
      HYDRA_INTERNAL_API_KEY: internalApiKey
      HYDRA_EXTERNAL_URL: http://core:5076
      MOCKSERVER_EXTERNAL_URL: http://127.0.0.1:5080
      MOCKSERVER_INTERNAL_URL: http://mockserver:5080
      RADARR_INTERNAL_URL: http://radarr:7878
      RADARR_EXTERNAL_URL: http://127.0.0.1:7878
      RADARR_API_KEY: system-test-api-key-12345
      SONARR_PRESET_URL: http://localhost:18989
      SONARR_INTERNAL_URL: http://sonarr:8989
      SONARR_EXTERNAL_URL: http://127.0.0.1:18989
      SONARR_API_KEY: system-test-api-key-12345
      SABNZBD_MOCK_API_KEY: deterministic-sabnzbd-key
    steps:
      - uses: actions/checkout@v4
        name: "Check out source"

      - name: Set artifact timestamp
        run: printf 'ARTIFACT_TIMESTAMP=%s\n' "$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/system/package-lock.json

      - name: Install Playwright dependencies
        working-directory: tests/system
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: "Build JVM core and test dependencies"
        run: mvn --batch-mode clean package -DskipTests -pl org.nzbhydra:core -am

      - name: "Download JaCoCo agent"
        run: |
          mvn --batch-mode dependency:get -Dartifact=org.jacoco:org.jacoco.agent:0.8.13:jar:runtime
          cp ~/.m2/repository/org/jacoco/org.jacoco.agent/0.8.13/org.jacoco.agent-0.8.13-runtime.jar core/target/jacoco-agent.jar

      - name: "Create docker network"
        run: docker network create systemtest

      - name: "Run JVM core and supporting containers"
        run: |
          docker compose -f docker/docker-compose-systemtest/linux/docker-compose.yaml -f docker/docker-compose-systemtest/linux/docker-compose-jvm-coverage.yaml up --quiet-pull -d mockserver sonarr radarr core

      - name: "Wait for JVM core"
        run: |
          wait_for_arr() {
            local name="$1"
            local port="$2"
            for attempt in {1..30}; do
              if curl --fail --silent --show-error --header "X-Api-Key: system-test-api-key-12345" "http://127.0.0.1:${port}/api/v3/system/status" > /dev/null; then
                return
              fi
              sleep 2
            done
            docker compose -f docker/docker-compose-systemtest/linux/docker-compose.yaml -f docker/docker-compose-systemtest/linux/docker-compose-jvm-coverage.yaml logs --no-color "${name}"
            exit 1
          }

          wait_for_arr sonarr 18989
          wait_for_arr radarr 7878
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5076/actuator/health/ping > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker/docker-compose-systemtest/linux/docker-compose.yaml -f docker/docker-compose-systemtest/linux/docker-compose-jvm-coverage.yaml logs --no-color
          exit 1

      - name: "Build"
        run: mvn --batch-mode install -pl org.nzbhydra:core -am -DtrimStackTrace=false -DskipTests
      - name: "Run system tests against JVM core"
        run: mvn --batch-mode test -pl org.nzbhydra.tests:system -DtrimStackTrace=false

      - name: "Run Playwright system tests against JVM core"
        working-directory: tests/system
        run: npm run test:full

      - name: "Upload Playwright artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test--linux-jvm-coverage--core--playwright--${{ env.ARTIFACT_TIMESTAMP }}
          path: |
            tests/system/playwright-report/**
            tests/system/test-results/**
          if-no-files-found: warn

      - name: "Stop JVM core"
        if: always()
        run: |
          curl --fail --silent http://127.0.0.1:5076/internalapi/control/shutdown > /dev/null || true
          for attempt in {1..30}; do
            if [ -f /tmp/hydra/defaultDataFolder/jacoco-system.exec ]; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: "Generate system test coverage"
        if: always()
        run: mvn --batch-mode org.jacoco:jacoco-maven-plugin:0.8.13:report -pl org.nzbhydra:nzbhydra2 -Djacoco.dataFile=/tmp/hydra/defaultDataFolder/jacoco-system.exec

      - name: "Upload JVM system test coverage"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test--linux-jvm-coverage--core--coverage-report--${{ env.ARTIFACT_TIMESTAMP }}
          path: core/target/site/jacoco/**
          if-no-files-found: warn

      - name: "Write JVM coverage Docker logs"
        if: always()
        run: docker compose -f docker/docker-compose-systemtest/linux/docker-compose.yaml -f docker/docker-compose-systemtest/linux/docker-compose-jvm-coverage.yaml logs --no-color > jvm-system-coverage-docker.log

      - name: "Upload JVM coverage logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test--linux-jvm-coverage--core--docker-logs--${{ env.ARTIFACT_TIMESTAMP }}
          path: jvm-system-coverage-docker.log




  runSystemTestsWindows:
    needs: [ waitForNative, buildMockserver ]
    runs-on: windows-latest
    env:
      spring_profiles_active: build,systemtest,core,testwindows
      nzbhydra_port: 5076
      nzbhydra.port: 5076
      nzbhydra_name: windows
      NZBHYDRANAME: windows
      nzbhydra.name: windows
    steps:
      - name: "Check out source"
        uses: actions/checkout@v4

      - name: Set artifact timestamp
        shell: pwsh
        run: '"ARTIFACT_TIMESTAMP=$((Get-Date).ToUniversalTime().ToString("yyyyMMddTHHmmssZ"))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: "Download windows artifact from current workflow"
        id: "downloadArtifactThisBuild"
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: native-build--windows-latest--release-executable--*
          path: ./
          merge-multiple: true

      - name: "Check if core.exe was downloaded"
        id: checkCoreExe
        uses: andstor/file-existence-action@v3
        with:
          files: core.exe

      - name: "Download windows artifact from previous workflow if no native build was executed"
        if: ${{steps.checkCoreExe.outputs.files_exists == 'false'}}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: ^native-build--windows-latest--release-executable--.*$
          name_is_regexp: true
          #Search for matching artifact in any of the last completed workflows
          search_artifacts: true
          workflow_conclusion: 'completed'
          path: .

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'

      - name: "Install maven"
        run: mvn --batch-mode clean install -DskipTests -pl org.nzbhydra:nzbhydra2,org.nzbhydra:shared,org.nzbhydra:mapping,org.nzbhydra:release-parser,org.nzbhydra:mockserver

      - name: "Add mockserver to /etc/hosts"
        run: |
          $file = "C:\Windows\System32\drivers\etc\hosts"
          $hostfile = Get-Content $file
          $hostfile += "127.0.0.1 mockserver"
          Set-Content -Path $file -Value $hostfile -Force

      - name: "Run native system tests with restore supervision"
        run: py misc\run_systemtest.py --skip-build --core-executable core.exe

      - name: "Check logs for unwanted strings"
        if: always()
        shell: pwsh
        run: |
          # Add unwanted strings to this list (one per line)
          $unwantedStrings = @(
            "Missing[A-Za-z]*Registration",
            "Unable to complete startup initialization"
          )

          $foundIssues = $false
          $logPaths = @("misc\.systemtest-runs", "tests")

          foreach ($pattern in $unwantedStrings) {
            Write-Host "Searching for: $pattern"
            foreach ($logPath in $logPaths) {
              if (Test-Path $logPath) {
                $results = Get-ChildItem -Path $logPath -Filter "*.log" -Recurse -ErrorAction SilentlyContinue | Select-String -Pattern $pattern -ErrorAction SilentlyContinue
                if ($results) {
                  Write-Host "::error::Found unwanted string '$pattern' in logs:"
                  $results | ForEach-Object {
                    Write-Host "  File: $($_.Path)"
                    Write-Host "  Line $($_.LineNumber): $($_.Line)"
                    # Show next 5 lines for context
                    $fileLines = Get-Content -Path $_.Path -ErrorAction SilentlyContinue
                    $startLine = $_.LineNumber
                    $endLine = [Math]::Min($startLine + 5, $fileLines.Count)
                    for ($i = $startLine; $i -lt $endLine; $i++) {
                      Write-Host "    $($fileLines[$i])"
                    }
                  }
                  $foundIssues = $true
                }
              }
            }
          }

          if ($foundIssues) {
            Write-Host "::error::Unwanted strings found in log files. See above for details."
            exit 1
          }
          Write-Host "No unwanted strings found in logs"

      - name: "Upload data folder artifact"
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: system-test--windows-native--restore-supervision--data-folder--${{ env.ARTIFACT_TIMESTAMP }}
          path: misc/.windows-systemtest-runs

      - name: "Upload test logs artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test--windows-native--restore-supervision--test-logs--${{ env.ARTIFACT_TIMESTAMP }}
          path: |
            tests/**/*.log
            tests/**/target/surefire-reports/**

      - name: "Upload docker logs artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test--windows-native--restore-supervision--docker-logs--${{ env.ARTIFACT_TIMESTAMP }}
          path: docker/*.log

      - name: "Create test Report"
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: System test report windows
          path: "**/surefire-reports/*.xml"
          reporter: java-junit
