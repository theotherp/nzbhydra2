#@formatter:off
name: Native Build

on:
    workflow_dispatch:
    workflow_call:

jobs:
    build:
        timeout-minutes: 45
        strategy:
            matrix:
                os: [ ubuntu-24.04, windows-latest ]
            fail-fast: false
        env:
            HYDRA_NATIVE_BUILD: true
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
            packages: write
            pull-requests: write
            actions: read
        steps:
            -   if: startsWith(matrix.os,'ubuntu')
                name: Log free memory
                run: free -s 1 -h -c 3
            -   uses: actions/checkout@v4
                with:
                    # Check out last 15 commits
                    fetch-depth: 15

            -   name: Set artifact timestamp
                shell: bash
                run: printf 'ARTIFACT_TIMESTAMP=%s\n' "$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_ENV"

            # Replaces a tj-actions/changed-files-based version disabled for a supply-chain
            # compromise (https://github.com/tj-actions/changed-files/issues/2463). dorny/paths-filter
            # is a different, actively maintained action from the same author as dorny/test-reporter,
            # already trusted elsewhere in this repo.
            -   name: "Detect changes affecting the native build/tests"
                id: changed
                if: >-
                    github.event_name == 'push' &&
                    github.event.before != '0000000000000000000000000000000000000000'
                uses: dorny/paths-filter@v3
                with:
                    base: ${{ github.event.before }}
                    filters: |
                        native:
                          - 'core/src/**'
                          - 'core/ui-react/**'
                          # React test files alone don't affect the native build/binary --
                          # only Playwright needs to run for those.
                          - '!core/ui-react/src/**/*.test.ts'
                          - '!core/ui-react/src/**/*.test.tsx'
                          - '!core/ui-react/src/**/*.spec.ts'
                          - '!core/ui-react/src/**/*.spec.tsx'
                          - 'core/pom.xml'
                          - 'shared/**'
                          - 'other/**'
                          - 'releases/**'
                          - 'docker/nativeTest/**'
                          - 'pom.xml'
                          - '.github/workflows/buildNative.yml'

            -   name: "Decide whether the native build and its tests are needed"
                id: build-decision
                shell: bash
                run: |
                    if [ "${{ steps.changed.outcome }}" = "success" ] && [ "${{ steps.changed.outputs.native }}" = "false" ]; then
                      echo "should-build=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::No changes under watched paths since the previous commit -- reusing the last native build and skipping the unit/native tests."
                    else
                      echo "should-build=true" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Set up JDK 21
                if: steps.build-decision.outputs.should-build == 'true'
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'adopt'
                    cache: 'maven'

            -   name: Set up Node 26
                if: steps.build-decision.outputs.should-build == 'true'
                uses: actions/setup-node@v4
                with:
                    node-version: 26
                    cache: npm
                    cache-dependency-path: core/ui-react/package-lock.json

            -   name: NativeImage
                uses: graalvm/setup-graalvm@v1
                if: steps.build-decision.outputs.should-build == 'true'
                with:
                    version: '25.1'
                    distribution: 'graalvm-community'
                    cache: 'maven'
                    github-token: ${{ secrets.GITHUB_TOKEN }}

            -   name: "Install all with Maven"
                if: steps.build-decision.outputs.should-build == 'true'
                run: mvn --batch-mode clean install -pl !org.nzbhydra:linux-amd64-release,!org.nzbhydra:linux-arm64-release,!org.nzbhydra:windows-release,!org.nzbhydra:generic-release -DskipTests -T 1C

            -   name: "Run unit tests"
                if: steps.build-decision.outputs.should-build == 'true'
                run: mvn --batch-mode org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent test -T 1C -pl !org.nzbhydra:tests,!org.nzbhydra.tests:system --fail-at-end

            -   name: "Convert unit test results to CTRF"
                if: always() && steps.build-decision.outputs.should-build == 'true'
                shell: bash
                run: npx --yes junit-to-ctrf "**/target/surefire-reports/*.xml" -o ctrf/unit-tests.json -t "JVM Unit Tests (${{ matrix.os }})"

            -   name: "Generate unit test coverage"
                if: always() && steps.build-decision.outputs.should-build == 'true'
                run: mvn --batch-mode org.jacoco:jacoco-maven-plugin:0.8.13:report -T 1C -pl !org.nzbhydra:tests,!org.nzbhydra.tests:system

            -   name: "Upload unit test coverage"
                if: always() && steps.build-decision.outputs.should-build == 'true'
                uses: actions/upload-artifact@v4
                with:
                    name: native-build--${{ matrix.os }}--unit-test-coverage--${{ env.ARTIFACT_TIMESTAMP }}
                    path: "**/target/site/jacoco/**"
                    if-no-files-found: warn

            -   name: "Create test Report"
                uses: dorny/test-reporter@v1
                if: always() && steps.build-decision.outputs.should-build == 'true'
                continue-on-error: true
                with:
                    name: Unit test report
                    path: "**/surefire-reports/*.xml"
                    reporter: java-junit

            -   name: "Run focused native tests"
                if: startsWith(matrix.os,'ubuntu') && steps.build-decision.outputs.should-build == 'true'
                working-directory: ./core
                run: mvn --batch-mode "-Pnative,nativeTest,strictReflection" clean test

            -   name: "Convert native test results to CTRF"
                if: always() && startsWith(matrix.os,'ubuntu') && steps.build-decision.outputs.should-build == 'true'
                shell: bash
                working-directory: ./core
                # The nativeTest profile reuses surefire's default reports dir, so this
                # must run before "Build native image" (which does `clean`) discards it.
                run: npx --yes junit-to-ctrf "target/surefire-reports/*.xml" -o ../ctrf/native-tests.json -t "Native Image Tests (${{ matrix.os }})"

            -   name: "Build native image"
                if: steps.build-decision.outputs.should-build == 'true'
                working-directory: ./core
                run: |
                    mvn --batch-mode "-Pnative,strictReflection" clean native:compile -DskipTests

            -   name: "Reuse last native build (no relevant changes)"
                if: steps.build-decision.outputs.should-build == 'false'
                continue-on-error: true
                uses: dawidd6/action-download-artifact@v6
                with:
                    name: ^native-build--${{ matrix.os }}--release-executable--.*$
                    name_is_regexp: true
                    search_artifacts: true
                    workflow_conclusion: 'completed'
                    path: core/target

            -   name: "Make reused Linux executable runnable"
                if: steps.build-decision.outputs.should-build == 'false' && startsWith(matrix.os,'ubuntu')
                run: chmod +x core/target/core

            -   name: "Check native startup on Linux"
                if: startsWith(matrix.os,'ubuntu')
                working-directory: ./core
                run: |
                    ./target/core -XX:MissingRegistrationReportingMode=Warn directstart --nobrowser --datafolder "$RUNNER_TEMP/native-startup" > native-startup.log 2>&1 &
                    pid=$!
                    cleanup() {
                      kill "$pid" 2>/dev/null || true
                      wait "$pid" 2>/dev/null || true
                    }
                    trap cleanup EXIT
                    ready=false
                    for attempt in {1..60}; do
                      if ! kill -0 "$pid" 2>/dev/null; then
                        break
                      fi
                      if curl --fail --silent http://127.0.0.1:5076/actuator/health/ping > /dev/null; then
                        ready=true
                        break
                      fi
                      sleep 1
                    done
                    if [ "$ready" != true ]; then
                      cat native-startup.log
                      exit 1
                    fi
                    if grep -E 'Missing[A-Za-z]*Registration|Unable to complete startup initialization' native-startup.log; then
                      cat native-startup.log
                      exit 1
                    fi
                    curl --fail --silent http://127.0.0.1:5076/static/react/assets/index.js > /dev/null

            -   name: "Check native startup on Windows"
                if: startsWith(matrix.os,'windows')
                working-directory: ./core
                shell: pwsh
                run: |
                    $stdout = 'native-startup.log'
                    $stderr = 'native-startup.err.log'
                    $process = Start-Process -FilePath '.\target\core.exe' -ArgumentList '-XX:MissingRegistrationReportingMode=Warn', 'directstart', '--nobrowser', '--datafolder', "$env:RUNNER_TEMP\native-startup" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
                    try {
                      $ready = $false
                      foreach ($attempt in 1..60) {
                        $process.Refresh()
                        if ($process.HasExited) {
                          break
                        }
                        try {
                          Invoke-WebRequest -Uri 'http://127.0.0.1:5076/actuator/health/ping' -UseBasicParsing | Out-Null
                          $ready = $true
                          break
                        } catch {
                          Start-Sleep -Seconds 1
                        }
                      }
                      if (-not $ready) {
                        Get-Content $stdout, $stderr
                        exit 1
                      }
                      Invoke-WebRequest -Uri 'http://127.0.0.1:5076/static/react/assets/index.js' -UseBasicParsing | Out-Null
                    } finally {
                      $process.Refresh()
                      if (-not $process.HasExited) {
                        Stop-Process -Id $process.Id -Force
                        $process.WaitForExit()
                      }
                    }
                    if (Select-String -Path $stdout, $stderr -Pattern 'Missing[A-Za-z]*Registration|Unable to complete startup initialization') {
                      Get-Content $stdout, $stderr
                      exit 1
                    }

            -   name: "Report native image size"
                shell: pwsh
                working-directory: ./core
                run: |
                    $executable = if ($IsWindows) { 'target/core.exe' } else { 'target/core' }
                    $size = (Get-Item $executable).Length
                    "Native image size: $size bytes" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

            -   name: "Publish test report"
                if: always() && steps.build-decision.outputs.should-build == 'true'
                uses: ctrf-io/github-test-reporter@v1
                with:
                    report-path: 'ctrf/*.json'
                    title: 'Native Build Tests (${{ matrix.os }})'
                    summary-report: true
                    insights-report: true
                    flaky-rate-report: true
                    slowest-report: true
                    fail-rate-report: true
                    upload-artifact: true
                    artifact-name: 'ctrf-report-native-build-${{ matrix.os }}'
                    fetch-previous-results: true
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: "Upload native build diagnostics"
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: native-build--${{ matrix.os }}--build-diagnostics--${{ env.ARTIFACT_TIMESTAMP }}
                    if-no-files-found: ignore
                    retention-days: 14
                    path: |
                        core/target/native-build-output.json
                        core/native-startup*.log

            -   name: "Upload linux artifact"
                if: startsWith(matrix.os,'ubuntu')
                uses: actions/upload-artifact@v4
                with:
                    name: native-build--ubuntu-24.04--release-executable--${{ env.ARTIFACT_TIMESTAMP }}
                    path: core/target/core

            -   name: "Upload windows artifact"
                if: startsWith(matrix.os,'windows')
                uses: actions/upload-artifact@v4
                with:
                    name: native-build--windows-latest--release-executable--${{ env.ARTIFACT_TIMESTAMP }}
                    path: core/target/core.exe

            -   name: Store if windows exe was built
                if: startsWith(matrix.os,'windows')
                run: echo "WINDOWS_BUILT=true" >> $GITHUB_ENV

            -   name: "Copy artifact to include folder"
                if: startsWith(matrix.os,'ubuntu')
                run: |
                    mv core/target/core ./docker/nativeTest/
                    chmod +x ./docker/nativeTest/core

            -   name: "Login to GitHub Container Registry"
                if: startsWith(matrix.os,'ubuntu')
                uses: docker/login-action@v2
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: "Build and push core container"
                if: startsWith(matrix.os,'ubuntu')
                run: |
                     cp other/wrapper/nzbhydra2wrapperPy3.py ./docker/nativeTest/
                     cd ./docker/nativeTest/
                     docker build -t hydradocker -t ghcr.io/theotherp/hydradocker:latest -t ghcr.io/theotherp/hydradocker:${{ github.ref_name}} -t ghcr.io/theotherp/hydradocker:${{ github.sha }} . --label "version=${{ github.ref_name}}" --label "sha=${{ github.sha }}"
                     push_with_retry() {
                         local image="$1"
                         for attempt in 1 2 3; do
                             if docker push "$image"; then
                                 return 0
                             fi
                             if [ "$attempt" -lt 3 ]; then
                                 sleep "$((attempt * 10))"
                             fi
                         done
                         return 1
                     }
                     push_with_retry ghcr.io/theotherp/hydradocker:latest
                     push_with_retry ghcr.io/theotherp/hydradocker:${{ github.sha }}
