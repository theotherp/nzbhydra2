schema_version: 2
components:
  - id: C-APP-SHELL
    responsibility: Responsive application frame, navigation, permissions, route outlet, and footer
    legacy:
      - core/ui-src/html/states/header.html
      - core/ui-src/js/header-controller.js
      - core/ui-src/js/directives/footer.js
    target: core/ui-react/src/app
    consumers:
      - F-PLATFORM-SHELL
      - F-PLATFORM-LIVE-STATUS
      - F-STATS-SHELL
    classification: shared_hydra
    state: partial
    note: FM-078 added the header's login/logout affordance (`shell-loginout`, rendered by `C-AUTH-SESSION`'s `LoginOutButton`), completing legacy's `header-controller.js` visibility rules. FM-080 added the shell's own half of `directives/footer.js`'s content-padding compensation -- measuring `C-UPDATE-COORDINATOR`'s footer banners' real rendered height rather than reproducing legacy's pixel bookkeeping -- and mounts those banners alongside the startup checks. The downloader-status footer (FM-081) remains. FM-154 (ADR-0049) added the nav-bar theme selector beside that affordance and `app/ThemePreferenceProvider.tsx`, which owns the in-session `ThemePreference` and provides the theme built from it; the shell's active-navigation accent now reads `palette.surfaces.barAccent` rather than `primary.main`, because the app bar's own ground differs per palette mode. FM-155 made the choice durable per user through `C-THEME-PREFERENCE`, which is a change to that provider and to the new service only -- the selector itself is untouched.
  - id: C-API-TRANSPORT
    responsibility: Base-URL-aware HTTP, binary, and progress-reporting upload transport with credentials, CSRF, session headers, and common errors. FM-075 added the upload method ADR-0003 reserved -- XHR-based, because fetch cannot
      observe request-body progress -- keeping the same base URL, `credentials`/`withCredentials`, and CSRF-header contract as `request`
    legacy:
      - core/ui-src/js/generic-error-handler.js
      - core/ui-src/js/file-download-service.js
      - core/ui-src/js/nzbhydra.js
    target: core/ui-react/src/api
    consumers:
      - F-PLATFORM-SHELL
      - F-AUTH-LOGIN
      - F-SEARCH-FORM
      - F-SEARCH-RESULTS
      - F-CONFIG-SHELL
      - F-STATS-SHELL
      - F-SYSTEM-SHELL
      - F-SYSTEM-BACKUP
      - F-SYSTEM-BUGREPORT
    classification: shared_hydra
    state: partial
  - id: C-LIVE-TRANSPORT
    responsibility: Base-URL-aware SockJS and STOMP connection lifecycle, outgoing frames, subscription cleanup, and typed message delivery. Since FM-085 every subscription sharing a base URL is multiplexed over one STOMP client and one
      SockJS socket, opened for the first subscription and deactivated when the last one closes; the ready timeout, `onReady` re-invocation after reconnect, parse-failure isolation, and the per-destination STOMP unsubscribe on close stay
      per subscription
    legacy:
      - core/ui-src/js/search-controller.js
      - core/ui-src/js/directives/downloaderStatusFooter.js
      - core/ui-src/js/directives/hydra-checks-footer.js
    target: core/ui-react/src/api/live
    consumers:
      - F-SEARCH-PROGRESS
      - F-PLATFORM-LIVE-STATUS
    classification: shared_hydra
    state: done
  - id: C-BOOTSTRAP-CONTEXT
    responsibility: Typed base URL, safe configuration, permissions, username, and server timezone bootstrap context. Per ADR-0017 the safe configuration is reactive server state -- a TanStack Query over `API-CONFIG-SAFE` seeded with the
      bootstrap value as `initialData` and invalidated after every successful config save; consumers read it through this context and never cache it outside the query
    legacy:
      - core/src/main/resources/templates/index.html
      - core/ui-src/js/config/config-service.js
      - core/ui-src/js/nzbhydra.js
    target: core/ui-react/src/bootstrap.ts; core/ui-react/src/app/SafeConfigProvider.tsx
    consumers:
      - F-PLATFORM-SHELL
      - F-AUTH-LOGIN
      - F-SEARCH-FORM
      - F-CONFIG-SHELL
      - F-STATS-SHELL
      - F-SYSTEM-SHELL
    classification: shared_hydra
    state: done
  - id: C-AUTH-SESSION
    responsibility: Login, logout, password challenge, current-session transitions, permissions, and route guards
    legacy:
      - core/ui-src/js/hydra-auth-service.js
      - core/ui-src/js/nzbhydra.js
    target: core/ui-react/src/features/auth
    consumers:
      - F-PLATFORM-SHELL
      - F-AUTH-LOGIN
      - F-SEARCH-FORM
      - F-CONFIG-SHELL
      - F-STATS-SHELL
      - F-SYSTEM-SHELL
    classification: shared_hydra
    state: partial
    note: 'FM-078 built the component -- form login, logout, the BASIC password challenge, the area permission rules (`permissions.ts`, legacy''s `loginRequired`), and the FORM login redirect used as a route guard in `router.tsx`. A session transition is
      committed by a full document navigation (`navigation.ts`), so no consumer observes session state changing in place. Verified live against a running instance: FORM login and FORM logout both transition and re-enter correctly, and the BASIC
      challenge logs the user in (`GET /internalapi/askpassword` answers 401 + `WWW-Authenticate` while anonymous and 200 once credentials are accepted; its 200 body is `UserInfosProvider.getUserInfos`, without `baseUrl`/`safeConfig`, so it must not be
      parsed as bootstrap data). Remaining gap, and why this is not `done`: logging out of a BASIC session does not end it -- the browser replays the cached `Authorization` header on the full navigation that follows, so the server renders an
      authenticated bootstrap again and the header still reads `Logout {username}`. Legacy hid the affordance in place instead (`header-controller.js` `event !== "loggedOut"`), so its logout at least looked like one. Ending a BASIC session needs a
      decision (the unused `POST /loggedout` endpoint invalidates the session and re-challenges) that FM-078 did not own.'
  - id: C-DIALOG-SERVICE
    responsibility: Accessible alerts, confirmations, and application dialogs with feature-owned bodies
    legacy:
      - core/ui-src/js/modal.js
      - core/ui-src/js/modal-service.js
    target: core/ui-react/src/components/dialogs
    consumers:
      - F-SEARCH-RESULTS
      - F-SEARCH-DOWNLOADS
      - F-CONFIG-SHELL
      - F-CONFIG-SEARCHING
      - F-CONFIG-DOWNLOADING
      - F-CONFIG-EXTERNAL-TOOLS
      - F-CONFIG-INDEXERS
      - F-SYSTEM-CONTROL
      - F-SYSTEM-BACKUP
    classification: shared_hydra
    state: partial
  - id: C-TOAST-SERVICE
    responsibility: Consistent transient notifications and severity mapping; concurrent toasts stack in arrival order, each with its own lifetime and optional persistence, over an overlay that stays transparent to pointer input. The toast layer is announced independently of any open modal - it renders under document.body and stays out of every subtree MUI's ModalManager marks aria-hidden, in both orderings (toast raised over an open dialog, and toast still on screen when a dialog opens). Per ADR-0037, a toast accepts no React element anywhere - content is always plain text (newlines become line breaks, never HTML), so no toast can carry actionable content that a modal's FocusTrap would leave untabbable; a toast's own close button is unaffected by this and stays untabbable while a modal is open, accepted by ADR-0037 - a keyboard user presses Escape to reach the toast
    legacy:
      - core/ui-src/js/nzbhydra.js
    target: core/ui-react/src/components/toasts
    consumers:
      - F-PLATFORM-LIVE-STATUS
      - F-SEARCH-RESULTS
      - F-SEARCH-DOWNLOADS
      - F-CONFIG-SHELL
      - F-CONFIG-NOTIFICATIONS
      - F-CONFIG-EXTERNAL-TOOLS
      - F-SYSTEM-SHELL
      - F-SYSTEM-CONTROL
      - F-SYSTEM-BACKUP
      - F-SYSTEM-BUGREPORT
    classification: shared_hydra
    state: done
  - id: C-DATE-TIME
    responsibility: Server-timezone-aware date parsing, formatting, and relative-time display
    legacy:
      - core/ui-src/js/indexer-statuses-controller.js
      - core/ui-src/js/directives/hydra-log.js
    target: core/ui-react/src/domain/date-time
    consumers:
      - F-STATS-INDEXERS
      - F-STATS-MAIN
      - F-HISTORY-SEARCHES
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-NOTIFICATIONS
      - F-SYSTEM-LOG
      - F-SYSTEM-TASKS
      - F-SYSTEM-BACKUP
      - F-SYSTEM-BUGREPORT
    classification: shared_hydra
    state: partial
    note: "FM-077 is the first consumer to need the relative-time half of legacy's humanizeDate/reformatDateSeconds pairing (every earlier consumer only needed formatServerDateTime's absolute half). It implements that half as a local Intl.RelativeTimeFormat helper in core/ui-react/src/features/system/tasks/relativeTime.ts rather than adding it here, since this task's Files Allowed To Modify does not include this module; formatServerDateTime/parseServerDateTime are reused unchanged for the tooltip and the parse."
  - id: C-BROWSER-STORAGE
    responsibility: "Guarded window.localStorage access: readItem/writeItem swallow a throwing storage accessor, a throwing getItem/setItem, and a storage-less
      environment. The guard only -- keys, default values, JSON encoding, and payload shape validation stay at the call sites, because they differ at every one
      (tri-state, default-false, validated JSON), and must not be pulled in here."
    legacy: []
    target: core/ui-react/src/domain/storage
    consumers:
      - F-PLATFORM-SHELL
      - F-SEARCH-FORM
      - F-SEARCH-SORT-FILTER
      - F-CONFIG-SHELL
      - F-STATS-MAIN
      - F-SYSTEM-LOG
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-SEARCHES
      - F-HISTORY-NOTIFICATIONS
    classification: shared_hydra
    state: done
    note: "FM-109 extracted it from five byte-similar getStorage()/try-catch copies (stats dashboard persistence, system-log persistence, config advancedFields,
      SearchWorkspace's advanced-panel flag, SearchResults' table choices). No storage key, payload, or default changed; the only observable difference is that
      SearchResults' choices write, previously guarded on the accessor but not on setItem, now also survives a throwing setItem."
  - id: C-SERVER-PREFERENCES
    responsibility: Server-backed per-user and global acknowledgements and UI preferences
    legacy:
      - core/ui-src/js/generic-storage-service.js
    target: core/ui-react/src/services/preferences; core/ui-react/src/api/preferences.ts
    consumers:
      - F-PLATFORM-LIVE-STATUS
      - F-PLATFORM-SHELL
      - F-SEARCH-SORT-FILTER
    classification: shared_hydra
    state: done
    note: "FM-079 built it for the startup checks' show-once flags: read, write, clear (legacy's `false`), and a per-user variant, all carrying `forUser` on every call as legacy did. It is also where the storage endpoint's one
      asymmetry is interpreted -- `GenericStorageWeb.put` stores the request body as a `String`, so the `false` a client writes to clear a flag reads back as the *string* `\"false\"`, which legacy's truthiness test accepted as a
      raised flag and which `isRaisedFlag` does not. FM-091 adopted it for F-SEARCH-SORT-FILTER's group-episodes help dialog (its polarity is inverted relative to FM-079's warning flags: raised means \"already shown\"), correcting
      this note's earlier F-SEARCH-RESULTS anticipation -- that feature never needed a server-backed preference."
  - id: C-RESTART-COORDINATOR
    responsibility: Restart command, progress dialog, readiness polling, and safe reload
    legacy:
      - core/ui-src/js/restart-service.js
      - core/ui-src/js/nzbhydra-control-service.js
    target: core/ui-react/src/services/restart
    consumers:
      - F-CONFIG-SHELL
      - F-SYSTEM-CONTROL
      - F-SYSTEM-UPDATES
      - F-SYSTEM-BACKUP
    classification: shared_hydra
    state: partial
  - id: C-CATEGORY-CATALOG
    responsibility: Typed Hydra category catalog, default category, and lookup semantics
    legacy:
      - core/ui-src/js/categories-service.js
    target: core/ui-react/src/domain/categories
    consumers:
      - F-SEARCH-FORM
      - F-SEARCH-INDEXERS
      - F-HISTORY-SEARCHES
      - F-CONFIG-CATEGORIES
      - F-CONFIG-INDEXERS
    classification: shared_hydra
    state: partial
  - id: C-DOWNLOAD-ACTIONS
    responsibility: >-
      Downloader selection, category choice, duplicate reason, black-hole, torrent, and magnet operations; an unset
      category selection resolves client-side to the downloader's configured defaultCategory (the fetched category
      list is a convenience for picking, never the authority for what is sent, and the server resolves nothing); the
      downloader selection is reconciled against the live configured downloader list (ADR-0017), never seeded once
      from mount-time config
    legacy:
      - core/ui-src/js/nzb-download-service.js
      - core/ui-src/js/downloader-categories-service.js
      - core/ui-src/js/downloader-request-service.js
      - core/ui-src/js/directives/save-or-send-torrent.js
    target: core/ui-react/src/domain/downloads
    consumers:
      - F-SEARCH-DOWNLOADS
      - F-HISTORY-DOWNLOADS
    classification: shared_hydra
    state: partial
  - id: C-DOWNLOADER-STATUS
    responsibility: Cross-route live downloader state, pause and offline state, URL, and rate history
    legacy:
      - core/ui-src/js/directives/downloaderStatusFooter.js
    target: core/ui-react/src/app/status
    consumers:
      - F-PLATFORM-LIVE-STATUS
    classification: shared_hydra
    state: done
  - id: C-UPDATE-COORDINATOR
    responsibility: Update metadata, install and ignore actions, changelog, global warnings, and restart handoff
    legacy:
      - core/ui-src/js/update-service.js
      - core/ui-src/js/directives/hydra-checks-footer.js
    target: core/ui-react/src/services/updates
    consumers:
      - F-PLATFORM-LIVE-STATUS
      - F-SYSTEM-UPDATES
      - F-SYSTEM-ABOUT
    classification: shared_hydra
    state: done
    note: FM-073 implemented the page portion (update offers, changelog, the install flow with its message poll, and the restart handoff). FM-080 completed the footer portion for F-PLATFORM-LIVE-STATUS -- the cross-route update banner (both variants, sharing `updateOffers`' withdrawal rule and `useUpdateInstaller`'s install flow), ignoring a version, and the automatic-update notice with its own changelog dialog and acknowledgement.
  - id: C-SAFE-RICH-CONTENT
    responsibility: Boundary-specific sanitization and rendering of trusted server-authored news HTML without an unrestricted HTML-trust helper
    legacy:
      - core/ui-src/js/filters.js
      - core/ui-src/html/modal.html
      - core/ui-src/html/config/indexer-config-box.html
      - core/ui-src/html/changelog-modal.html
      - core/ui-src/html/directives/news.html
    target: core/ui-react/src/components/content
    consumers:
      - F-SYSTEM-NEWS
      - F-SYSTEM-UPDATES
    classification: shared_hydra
    state: partial
  - id: C-TABLE-SCROLL-AFFORDANCE
    responsibility: ADR-0038's single scroll-edge affordance for horizontally scrollable tables -- one `TableContainer` wrapper that reads its own scroll metrics (`scrollLeft`/`scrollWidth`/`clientWidth`, re-read on `scroll` and on a
      guarded `ResizeObserver` over both the scroller and its content) and paints a fade at each edge that currently clips content, clearing that edge's fade once it is scrolled to its limit. It owns the affordance only; each consuming table
      still declares its own measured `minWidth` floor, because the width at which a table's columns stop being squeezed is a property of that table's columns, not of the scroller
    note: FM-156 moved the edge fade's scrim off an `alpha(common.black, 0.45)` call-site literal onto the per-theme `surfaces.tableScrollFade` token (ADR-0014). The three dark themes declare the colour the component composited before,
      so their rendering is unchanged; `bright` declares its own, because on a white card the inherited scrim was a 3.33:1 black smear that dropped `text.primary` from 17.75:1 to 5.33:1
    legacy: []
    target: core/ui-react/src/components/table/TableScrollAffordance.tsx
    consumers:
      - F-HISTORY-SEARCHES
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-NOTIFICATIONS
      - F-CONFIG-INDEXERS
      - F-CONFIG-CATEGORIES
    classification: shared_hydra
    state: done
  - id: C-EXTERNAL-LINKS
    responsibility: Safe-configuration-aware external-link dereferer transformation for URLs and embedded help text
    legacy:
      - core/ui-src/js/nzbhydra.js
      - core/ui-src/html/about.html
      - core/ui-src/html/states/config.html
      - core/ui-src/html/directives/search-result.html
    target: core/ui-react/src/domain/links
    consumers:
      - F-CONFIG-SHELL
      - F-CONFIG-MAIN
      - F-SEARCH-RESULTS
      - F-HISTORY-SAVED-SEARCHES
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-NOTIFICATIONS
      - F-SYSTEM-ABOUT
    classification: shared_hydra
    state: partial
  - id: C-RESULT-TABLE
    responsibility: Hydra-specific search result processing, paging, grouping, filtering, sorting, selection, and presentation using TanStack primitives; the table is fluid, with no horizontal scroll at
      any width at or above the 768px stacking breakpoint, so no scrolling ancestor exists between a sticky column header <th> and the document -- the property that makes the viewport-sticky header
      possible
    legacy:
      - core/ui-src/html/states/search-results.html
      - core/ui-src/js/search-results-controller.js
      - core/ui-src/js/directives/dataTableDirectives.js
    target: core/ui-react/src/features/search/results
    consumers:
      - F-SEARCH-RESULTS
      - F-SEARCH-SORT-FILTER
      - F-SEARCH-GROUP-SELECTION
      - F-SEARCH-DOWNLOADS
    classification: feature_specific
    state: partial
  - id: C-HISTORY-REFINE-BAR
    responsibility: Shared stats-history refine sections and filter state -- the single filter surface beside every history table, declared as the filter kinds org.nzbhydra.historystats.History supports (time range, freetext, multi-select
      checkboxes, boolean, number range) with active-filter count and clear-all. It owns state and options only -- HistoryFilterValues filtered server-side through C-HISTORY-REQUEST rather than over already-loaded rows, and options each
      route declares rather than derives from the page of results it is showing -- the two differences from the results sidebar that ADR-0046 kept. Its chrome is C-REFINE-SURFACE's since FM-137 (the docked column, the collapsed rail, the
      sub-768px drawer, the header row), so no width, padding, or transition is stated here; the docked collapsed state persists through C-BROWSER-STORAGE under one hydra.history.refine key shared by all three views, and the drawer's open
      state is never persisted
    legacy:
      - core/ui-src/js/directives/dataTableDirectives.js
      - core/ui-src/html/states/download-history.html
      - core/ui-src/html/states/search-history.html
      - core/ui-src/html/states/notification-history.html
    target: core/ui-react/src/features/stats/history/refine
    consumers:
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-SEARCHES
      - F-HISTORY-NOTIFICATIONS
    classification: feature_specific
    state: partial
    note: FM-137 (ADR-0046) moved the chrome to C-REFINE-SURFACE and the file with it (HistoryRefineSurface.tsx, beside historyRefineCollapsed.ts). Every history-refine-* section and control id survived unchanged, including ADR-0016's
      empty-selection semantics; history-refine-bar now names whichever branch is live and history-refine-summary/-drawer/-close were added. The "deliberately shares no code with RefineSidebar" stance this record and the source file both
      carried is superseded for the chrome only -- the state and options reasons it gave are the retained rationale above. FM-142 moved history-refine-summary from the header's right edge to its left slot and made it single-line (noWrap)
      when the shared header dropped its "Refine" caption; the sentence, the id, and the rail/compact fallbacks that carry the count where the slot is hidden are unchanged. FM-153 (ADR-0050) replaced the checkboxes kind's wrapping refineChip row with C-REFINE-MULTISELECT, so that history-refine-<id> and
      -option survived, -toggle and -list were added, the sections start collapsed on every mount and persist no open state, and ADR-0016's empty-selection
      semantics and the dimensions' declared option order are unchanged. The standalone history-refine-<id>-label caption element is gone for checkboxes
      sections (never listed as a selector, zero references repo-wide) -- the caption is now the -toggle button, and the sections' role="group" naming moved to
      C-REFINE-MULTISELECT's groupLabel aria-label.
  - id: C-HISTORY-PAGER
    responsibility: Shared page navigation and page-size choice for the three paged history tables -- first/previous/numbered-with-ellipsis/next/last controls, the disabled-edge and aria-current="page" states, one "Page N of M / X entries"
      status line, and the offered page sizes (`features/stats/shared/pageSize.ts`). It owns navigation only, never fetching, filter state, or the request itself; the chosen page and size are URL state (FM-165's schema, extended by FM-166's
      `size` parameter), not component state. It computes `totalPages` from the total and the size it is handed, which is why the three pages no longer each carry that expression
    legacy:
      - core/ui-src/html/dirPagination.tpl.html
      - core/ui-src/js/download-history-controller.js
    target: core/ui-react/src/features/stats/history/HistoryPager.tsx
    consumers:
      - F-HISTORY-SEARCHES
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-NOTIFICATIONS
    classification: shared_hydra
    state: done
    note: Id reserved 2026-08-31 by the FM-162..FM-170 design batch; FM-166 implemented it. Legacy paths are in git history only (core/ui-src was removed by a31df3aa2). Built on MUI's `Pagination` at boundaryCount 1 and siblingCount 2, which
      reproduces `dirPagination`'s own nine-slot windowing page for page; `getItemAriaLabel` keeps the "Previous page"/"Next page" names the three hand-rolled pagers carried, and `renderItem` adds the `aria-current="page"` MUI does not set.
      The status line's test id is per route because `notification-history-page-status` is an existing spec contract
  - id: C-COPY-VALUE-BUTTON
    responsibility: One copy-to-clipboard icon button for a single table-cell value -- always in the DOM, revealed on row hover and on focus so it is keyboard-reachable, labelled per value, confirming and failing through C-TOAST-SERVICE, and
      rendering nothing at all where navigator.clipboard is unavailable (NZBHydra is routinely served over plain HTTP). It is offered only on free text or machine-generated identifiers a user pastes elsewhere and that no existing action
      already yields; short enumerated columns (time, category, source, result, age, indexer, type, username) get none
    legacy: []
    target: core/ui-react/src/components/CopyValueButton.tsx
    consumers:
      - F-HISTORY-SEARCHES
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-NOTIFICATIONS
    classification: shared_hydra
    state: planned
    note: Id reserved 2026-08-31 by the FM-162..FM-170 design batch; FM-170 implements it. DownloadActions' bulk "Copy selected links" button is deliberately not a consumer yet -- it copies a computed multi-line list with its own messages
  - id: C-HISTORY-REQUEST
    responsibility: Shared HistoryRequest construction (page, limit, filterModel, sortModel, distinct, onlyCurrentUser) and paged-response envelope validation for every org.nzbhydra.historystats.HistoryWeb endpoint, so each history route
      declares dimensions instead of building its own filter model
    legacy:
      - core/ui-src/js/stats-service.js
      - core/ui-src/js/search-history-service.js
      - core/ui-src/js/directives/dataTableDirectives.js
    target: core/ui-react/src/api/history/filters.ts; core/ui-react/src/api/history/request.ts
    consumers:
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-SEARCHES
      - F-HISTORY-NOTIFICATIONS
    classification: shared_hydra
    state: partial
  - id: C-REFINE-SURFACE
    responsibility: Shared refine-surface chrome shell (ADR-0046) -- the docked 248px left column / 48px rail / sub-768px drawer switching, header row (the consumer's optional summary in the left slot, an icon-only clear-all and the
      collapse/close toggle at the end, and no caption), widths, paddings, transitions, and
      stickiness, taken from RefineSidebar.tsx; it takes sections, clear-all wiring, an optional sticky offset, an optional header summary, and per-consumer test ids as props and owns no filter state -- ResultFilters stays with the
      results feature and HistoryFilterValues with the history features
    legacy: []
    target: core/ui-react/src/components/refine
    consumers:
      - F-SEARCH-SORT-FILTER
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-SEARCHES
      - F-HISTORY-NOTIFICATIONS
    classification: shared_hydra
    state: done
    note: FM-136 extracted the shell and re-based the results sidebar on it at proven byte parity (the rendered refine-sidebar outerHTML is identical for the docked expanded, docked collapsed, and drawer branches). Its own labels
      and data-testid values are props, so RefineSidebar.tsx keeps refine-sidebar/-toggle/-drawer/-close and refine-clear-all unchanged; useCompactRefineSurface moved into the shell module with it. FM-137 added the three history views
      as consumers without changing the shell, which is what closes ADR-0046's one-refine-concept goal -- the history surfaces pass stickyOffset 0 (nothing sticky sits above a /stats tab body) and a header summary the results page does not
      use. FM-142 (owner request 2026-08-30) redesigned that header row -- the "Refine" caption is gone from every branch and every consumer (RefineSurfaceLabels.heading is the compact trigger's visible text and nothing else), "Clear all"
      became an icon-only ClearAllIcon control named "Clear all filters" (the clearAll/close/drawer/surface/toggle test ids, the disabled rule and the onClearAll wiring all unchanged), and the summary took the header's left slot on a
      single line. That closes FM-137's recorded cramped-header finding -- at 248px minus the px 2 padding the old caption + summary + text button + toggle overflowed 216px, wrapping "No active filters" over two lines and "Clear all"
      inside its own button in the drawer -- pinned now by a geometry assertion in search-history.spec.ts's visual-evidence test. theme.ts's refineSurfaceLabel typography variant left with the caption, its last consumer.
  - id: C-SECRET-INPUT
    responsibility: Masked secret editing with unchanged-secret semantics -- the `***UNCHANGED***` marker originates from the server (`@HiddenInUI` fields plus hashed user passwords) and is preserved byte-for-byte until the user edits the
      field; it is never synthesized on the client. FM-064 is its first consumer inside a modal transaction -- it binds to the edit dialog's draft form, so an uncommitted edit, and a marker the admin never touched, cannot reach
      `C-CONFIG-FORM` until the dialog is submitted. FM-066 is the first consumer whose dialog also *posts* the draft to the backend -- `IndexerConfig.apiKey`/`username`/`password` travel to the connection and capability checks still carrying
