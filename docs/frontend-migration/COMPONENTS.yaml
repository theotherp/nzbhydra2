schema_version: 2
components:
  - id: C-APP-SHELL
    responsibility: Responsive application frame, navigation, permissions, route outlet, and footer
    legacy:
      - core/ui-src/html/states/header.html
      - core/ui-src/js/header-controller.js
      - core/ui-src/js/directives/footer.js
    target: core/ui-react/src/app
    consumers:
      - F-PLATFORM-SHELL
      - F-PLATFORM-LIVE-STATUS
      - F-STATS-SHELL
    classification: shared_hydra
    state: partial
    note: FM-078 added the header's login/logout affordance (`shell-loginout`, rendered by `C-AUTH-SESSION`'s `LoginOutButton`), completing legacy's `header-controller.js` visibility rules. FM-080 added the shell's own half of `directives/footer.js`'s content-padding compensation -- measuring `C-UPDATE-COORDINATOR`'s footer banners' real rendered height rather than reproducing legacy's pixel bookkeeping -- and mounts those banners alongside the startup checks. The downloader-status footer (FM-081) remains.
  - id: C-API-TRANSPORT
    responsibility: Base-URL-aware HTTP, binary, and progress-reporting upload transport with credentials, CSRF, session headers, and common errors. FM-075 added the upload method ADR-0003 reserved -- XHR-based, because fetch cannot
      observe request-body progress -- keeping the same base URL, `credentials`/`withCredentials`, and CSRF-header contract as `request`
    legacy:
      - core/ui-src/js/generic-error-handler.js
      - core/ui-src/js/file-download-service.js
      - core/ui-src/js/nzbhydra.js
    target: core/ui-react/src/api
    consumers:
      - F-PLATFORM-SHELL
      - F-AUTH-LOGIN
      - F-SEARCH-FORM
      - F-SEARCH-RESULTS
      - F-CONFIG-SHELL
      - F-STATS-SHELL
      - F-SYSTEM-SHELL
      - F-SYSTEM-BACKUP
      - F-SYSTEM-BUGREPORT
    classification: shared_hydra
    state: partial
  - id: C-LIVE-TRANSPORT
    responsibility: Base-URL-aware SockJS and STOMP connection lifecycle, outgoing frames, subscription cleanup, and typed message delivery. Since FM-085 every subscription sharing a base URL is multiplexed over one STOMP client and one
      SockJS socket, opened for the first subscription and deactivated when the last one closes; the ready timeout, `onReady` re-invocation after reconnect, parse-failure isolation, and the per-destination STOMP unsubscribe on close stay
      per subscription
    legacy:
      - core/ui-src/js/search-controller.js
      - core/ui-src/js/directives/downloaderStatusFooter.js
      - core/ui-src/js/directives/hydra-checks-footer.js
    target: core/ui-react/src/api/live
    consumers:
      - F-SEARCH-PROGRESS
      - F-PLATFORM-LIVE-STATUS
    classification: shared_hydra
    state: done
  - id: C-BOOTSTRAP-CONTEXT
    responsibility: Typed base URL, safe configuration, permissions, username, and server timezone bootstrap context. Per ADR-0017 the safe configuration is reactive server state -- a TanStack Query over `API-CONFIG-SAFE` seeded with the
      bootstrap value as `initialData` and invalidated after every successful config save; consumers read it through this context and never cache it outside the query
    legacy:
      - core/src/main/resources/templates/index.html
      - core/ui-src/js/config/config-service.js
      - core/ui-src/js/nzbhydra.js
    target: core/ui-react/src/bootstrap.ts; core/ui-react/src/app/SafeConfigProvider.tsx
    consumers:
      - F-PLATFORM-SHELL
      - F-AUTH-LOGIN
      - F-SEARCH-FORM
      - F-CONFIG-SHELL
      - F-STATS-SHELL
      - F-SYSTEM-SHELL
    classification: shared_hydra
    state: done
  - id: C-AUTH-SESSION
    responsibility: Login, logout, password challenge, current-session transitions, permissions, and route guards
    legacy:
      - core/ui-src/js/hydra-auth-service.js
      - core/ui-src/js/nzbhydra.js
    target: core/ui-react/src/features/auth
    consumers:
      - F-PLATFORM-SHELL
      - F-AUTH-LOGIN
      - F-SEARCH-FORM
      - F-CONFIG-SHELL
      - F-STATS-SHELL
      - F-SYSTEM-SHELL
    classification: shared_hydra
    state: partial
    note: 'FM-078 built the component -- form login, logout, the BASIC password challenge, the area permission rules (`permissions.ts`, legacy''s `loginRequired`), and the FORM login redirect used as a route guard in `router.tsx`. A session transition is
      committed by a full document navigation (`navigation.ts`), so no consumer observes session state changing in place. Verified live against a running instance: FORM login and FORM logout both transition and re-enter correctly, and the BASIC
      challenge logs the user in (`GET /internalapi/askpassword` answers 401 + `WWW-Authenticate` while anonymous and 200 once credentials are accepted; its 200 body is `UserInfosProvider.getUserInfos`, without `baseUrl`/`safeConfig`, so it must not be
      parsed as bootstrap data). Remaining gap, and why this is not `done`: logging out of a BASIC session does not end it -- the browser replays the cached `Authorization` header on the full navigation that follows, so the server renders an
      authenticated bootstrap again and the header still reads `Logout {username}`. Legacy hid the affordance in place instead (`header-controller.js` `event !== "loggedOut"`), so its logout at least looked like one. Ending a BASIC session needs a
      decision (the unused `POST /loggedout` endpoint invalidates the session and re-challenges) that FM-078 did not own.'
  - id: C-DIALOG-SERVICE
    responsibility: Accessible alerts, confirmations, and application dialogs with feature-owned bodies
    legacy:
      - core/ui-src/js/modal.js
      - core/ui-src/js/modal-service.js
    target: core/ui-react/src/components/dialogs
    consumers:
      - F-SEARCH-RESULTS
      - F-SEARCH-DOWNLOADS
      - F-CONFIG-SHELL
      - F-CONFIG-SEARCHING
      - F-CONFIG-DOWNLOADING
      - F-CONFIG-EXTERNAL-TOOLS
      - F-CONFIG-INDEXERS
      - F-SYSTEM-CONTROL
      - F-SYSTEM-BACKUP
    classification: shared_hydra
    state: partial
  - id: C-TOAST-SERVICE
    responsibility: Consistent transient notifications and severity mapping; concurrent toasts stack in arrival order, each with its own lifetime, optional persistence, and optional rich content, over an overlay that stays transparent to pointer input. The toast layer is announced independently of any open modal - it renders under document.body and stays out of every subtree MUI's ModalManager marks aria-hidden, in both orderings (toast raised over an open dialog, and toast still on screen when a dialog opens). Known gap - a toast's own controls, and any actionable content inside it, remain untabbable while a modal is open, because the modal's FocusTrap owns focus regardless of DOM position; fixing that means relaxing FocusTrap app-wide, rendering toasts inside the open modal, or forbidding actionable toast content, each of which changes modal behaviour or a shared type across modules, so it is carried as an open decision in MAINTENANCE.md rather than fixed here
    legacy:
      - core/ui-src/js/nzbhydra.js
    target: core/ui-react/src/components/toasts
    consumers:
      - F-PLATFORM-LIVE-STATUS
      - F-SEARCH-RESULTS
      - F-SEARCH-DOWNLOADS
      - F-CONFIG-SHELL
      - F-CONFIG-NOTIFICATIONS
      - F-CONFIG-EXTERNAL-TOOLS
      - F-SYSTEM-SHELL
      - F-SYSTEM-CONTROL
      - F-SYSTEM-BACKUP
      - F-SYSTEM-BUGREPORT
    classification: shared_hydra
    state: partial
  - id: C-DATE-TIME
    responsibility: Server-timezone-aware date parsing, formatting, and relative-time display
    legacy:
      - core/ui-src/js/indexer-statuses-controller.js
      - core/ui-src/js/directives/hydra-log.js
    target: core/ui-react/src/domain/date-time
    consumers:
      - F-STATS-INDEXERS
      - F-STATS-MAIN
      - F-HISTORY-SEARCHES
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-NOTIFICATIONS
      - F-SYSTEM-LOG
      - F-SYSTEM-TASKS
      - F-SYSTEM-BACKUP
      - F-SYSTEM-BUGREPORT
    classification: shared_hydra
    state: partial
    note: "FM-077 is the first consumer to need the relative-time half of legacy's humanizeDate/reformatDateSeconds pairing (every earlier consumer only needed formatServerDateTime's absolute half). It implements that half as a local Intl.RelativeTimeFormat helper in core/ui-react/src/features/system/tasks/relativeTime.ts rather than adding it here, since this task's Files Allowed To Modify does not include this module; formatServerDateTime/parseServerDateTime are reused unchanged for the tooltip and the parse."
  - id: C-BROWSER-STORAGE
    responsibility: "Guarded window.localStorage access: readItem/writeItem swallow a throwing storage accessor, a throwing getItem/setItem, and a storage-less
      environment. The guard only -- keys, default values, JSON encoding, and payload shape validation stay at the call sites, because they differ at every one
      (tri-state, default-false, validated JSON), and must not be pulled in here."
    legacy: []
    target: core/ui-react/src/domain/storage
    consumers:
      - F-SEARCH-FORM
      - F-SEARCH-SORT-FILTER
      - F-CONFIG-SHELL
      - F-STATS-MAIN
      - F-SYSTEM-LOG
    classification: shared_hydra
    state: done
    note: "FM-109 extracted it from five byte-similar getStorage()/try-catch copies (stats dashboard persistence, system-log persistence, config advancedFields,
      SearchWorkspace's advanced-panel flag, SearchResults' table choices). No storage key, payload, or default changed; the only observable difference is that
      SearchResults' choices write, previously guarded on the accessor but not on setItem, now also survives a throwing setItem."
  - id: C-SERVER-PREFERENCES
    responsibility: Server-backed per-user and global acknowledgements and UI preferences
    legacy:
      - core/ui-src/js/generic-storage-service.js
    target: core/ui-react/src/services/preferences; core/ui-react/src/api/preferences.ts
    consumers:
      - F-PLATFORM-LIVE-STATUS
      - F-SEARCH-SORT-FILTER
    classification: shared_hydra
    state: done
    note: "FM-079 built it for the startup checks' show-once flags: read, write, clear (legacy's `false`), and a per-user variant, all carrying `forUser` on every call as legacy did. It is also where the storage endpoint's one
      asymmetry is interpreted -- `GenericStorageWeb.put` stores the request body as a `String`, so the `false` a client writes to clear a flag reads back as the *string* `\"false\"`, which legacy's truthiness test accepted as a
      raised flag and which `isRaisedFlag` does not. FM-091 adopted it for F-SEARCH-SORT-FILTER's group-episodes help dialog (its polarity is inverted relative to FM-079's warning flags: raised means \"already shown\"), correcting
      this note's earlier F-SEARCH-RESULTS anticipation -- that feature never needed a server-backed preference."
  - id: C-RESTART-COORDINATOR
    responsibility: Restart command, progress dialog, readiness polling, and safe reload
    legacy:
      - core/ui-src/js/restart-service.js
      - core/ui-src/js/nzbhydra-control-service.js
    target: core/ui-react/src/services/restart
    consumers:
      - F-CONFIG-SHELL
      - F-SYSTEM-CONTROL
      - F-SYSTEM-UPDATES
      - F-SYSTEM-BACKUP
    classification: shared_hydra
    state: partial
  - id: C-CATEGORY-CATALOG
    responsibility: Typed Hydra category catalog, default category, and lookup semantics
    legacy:
      - core/ui-src/js/categories-service.js
    target: core/ui-react/src/domain/categories
    consumers:
      - F-SEARCH-FORM
      - F-SEARCH-INDEXERS
      - F-HISTORY-SEARCHES
      - F-CONFIG-CATEGORIES
      - F-CONFIG-INDEXERS
    classification: shared_hydra
    state: partial
  - id: C-DOWNLOAD-ACTIONS
    responsibility: >-
      Downloader selection, category choice, duplicate reason, black-hole, torrent, and magnet operations; an unset
      category selection resolves client-side to the downloader's configured defaultCategory (the fetched category
      list is a convenience for picking, never the authority for what is sent, and the server resolves nothing)
    legacy:
      - core/ui-src/js/nzb-download-service.js
      - core/ui-src/js/downloader-categories-service.js
      - core/ui-src/js/downloader-request-service.js
      - core/ui-src/js/directives/save-or-send-torrent.js
    target: core/ui-react/src/domain/downloads
    consumers:
      - F-SEARCH-DOWNLOADS
      - F-HISTORY-DOWNLOADS
    classification: shared_hydra
    state: partial
  - id: C-DOWNLOADER-STATUS
    responsibility: Cross-route live downloader state, pause and offline state, URL, and rate history
    legacy:
      - core/ui-src/js/directives/downloaderStatusFooter.js
    target: core/ui-react/src/app/status
    consumers:
      - F-PLATFORM-LIVE-STATUS
    classification: shared_hydra
    state: done
  - id: C-UPDATE-COORDINATOR
    responsibility: Update metadata, install and ignore actions, changelog, global warnings, and restart handoff
    legacy:
      - core/ui-src/js/update-service.js
      - core/ui-src/js/directives/hydra-checks-footer.js
    target: core/ui-react/src/services/updates
    consumers:
      - F-PLATFORM-LIVE-STATUS
      - F-SYSTEM-UPDATES
      - F-SYSTEM-ABOUT
    classification: shared_hydra
    state: done
    note: FM-073 implemented the page portion (update offers, changelog, the install flow with its message poll, and the restart handoff). FM-080 completed the footer portion for F-PLATFORM-LIVE-STATUS -- the cross-route update banner (both variants, sharing `updateOffers`' withdrawal rule and `useUpdateInstaller`'s install flow), ignoring a version, and the automatic-update notice with its own changelog dialog and acknowledgement.
  - id: C-SAFE-RICH-CONTENT
    responsibility: Boundary-specific sanitization and rendering of trusted server-authored news HTML without an unrestricted HTML-trust helper
    legacy:
      - core/ui-src/js/filters.js
      - core/ui-src/html/modal.html
      - core/ui-src/html/config/indexer-config-box.html
      - core/ui-src/html/changelog-modal.html
      - core/ui-src/html/directives/news.html
    target: core/ui-react/src/components/content
    consumers:
      - F-SYSTEM-NEWS
      - F-SYSTEM-UPDATES
    classification: shared_hydra
    state: partial
  - id: C-EXTERNAL-LINKS
    responsibility: Safe-configuration-aware external-link dereferer transformation for URLs and embedded help text
    legacy:
      - core/ui-src/js/nzbhydra.js
      - core/ui-src/html/about.html
      - core/ui-src/html/states/config.html
      - core/ui-src/html/directives/search-result.html
    target: core/ui-react/src/domain/links
    consumers:
      - F-CONFIG-SHELL
      - F-CONFIG-MAIN
      - F-SEARCH-RESULTS
      - F-HISTORY-SAVED-SEARCHES
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-NOTIFICATIONS
      - F-SYSTEM-ABOUT
    classification: shared_hydra
    state: partial
  - id: C-RESULT-TABLE
    responsibility: Hydra-specific search result processing, paging, grouping, filtering, sorting, selection, and presentation using TanStack primitives; the table is fluid, with no horizontal scroll at
      any width at or above the 768px stacking breakpoint, so no scrolling ancestor exists between a sticky column header <th> and the document -- the property that makes the viewport-sticky header
      possible
    legacy:
      - core/ui-src/html/states/search-results.html
      - core/ui-src/js/search-results-controller.js
      - core/ui-src/js/directives/dataTableDirectives.js
    target: core/ui-react/src/features/search/results
    consumers:
      - F-SEARCH-RESULTS
      - F-SEARCH-SORT-FILTER
      - F-SEARCH-GROUP-SELECTION
      - F-SEARCH-DOWNLOADS
    classification: feature_specific
    state: partial
  - id: C-HISTORY-REFINE-BAR
    responsibility: Shared stats-history refine bar -- the single filter surface above every history table, declared as the filter kinds org.nzbhydra.historystats.History supports (time range, freetext, multi-select checkboxes, boolean,
      number range) with active-filter count and clear-all; it matches the search refine sidebar's token and structure language through theme.ts without sharing its code or its client-side ResultFilters state
    legacy:
      - core/ui-src/js/directives/dataTableDirectives.js
      - core/ui-src/html/states/download-history.html
      - core/ui-src/html/states/search-history.html
      - core/ui-src/html/states/notification-history.html
    target: core/ui-react/src/features/stats/history/refine/HistoryRefineBar.tsx
    consumers:
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-SEARCHES
      - F-HISTORY-NOTIFICATIONS
    classification: feature_specific
    state: partial
  - id: C-HISTORY-REQUEST
    responsibility: Shared HistoryRequest construction (page, limit, filterModel, sortModel, distinct, onlyCurrentUser) and paged-response envelope validation for every org.nzbhydra.historystats.HistoryWeb endpoint, so each history route
      declares dimensions instead of building its own filter model
    legacy:
      - core/ui-src/js/stats-service.js
      - core/ui-src/js/search-history-service.js
      - core/ui-src/js/directives/dataTableDirectives.js
    target: core/ui-react/src/api/history/filters.ts; core/ui-react/src/api/history/request.ts
    consumers:
      - F-HISTORY-DOWNLOADS
      - F-HISTORY-SEARCHES
      - F-HISTORY-NOTIFICATIONS
    classification: shared_hydra
    state: partial
  - id: C-SECRET-INPUT
    responsibility: Masked secret editing with unchanged-secret semantics -- the `***UNCHANGED***` marker originates from the server (`@HiddenInUI` fields plus hashed user passwords) and is preserved byte-for-byte until the user edits the
      field; it is never synthesized on the client. FM-064 is its first consumer inside a modal transaction -- it binds to the edit dialog's draft form, so an uncommitted edit, and a marker the admin never touched, cannot reach
      `C-CONFIG-FORM` until the dialog is submitted. FM-066 is the first consumer whose dialog also *posts* the draft to the backend -- `IndexerConfig.apiKey`/`username`/`password` travel to the connection and capability checks still carrying
      the marker, because `IndexerChecker.resolveUnchangedSensitiveFields` looks the stored value up by indexer name -- and the capability check's response, which carries the resolved credentials, is therefore never copied back wholesale
    legacy:
      - core/ui-src/js/config/formly-config.js
    target: core/ui-react/src/features/config/components/SecretInput.tsx
    consumers:
      - F-CONFIG-MAIN
      - F-CONFIG-AUTH
      - F-CONFIG-DOWNLOADING
      - F-CONFIG-EXTERNAL-TOOLS
      - F-CONFIG-INDEXERS
    classification: feature_specific
    state: done
  - id: C-CONFIG-FORM
    responsibility: The config area's whole-`BaseConfig` spine -- a hand-written Zod envelope whose every object schema passes unknown keys through, one React Hook Form over the complete config shared by all eight tabs, and the
      save pipeline that refuses to submit an invalid form and maps `ConfigValidationResult` to blocking errors, confirmable warnings, restart handoff, and a reset from the server's `newConfig`. Since FM-097 it also derives the shell's
      unsaved-work summary from that one form state -- how many settings changed, and which top-level section each change or validation error belongs to -- so the sticky save bar and the settings nav's per-section badges cannot disagree
    legacy:
      - core/ui-src/js/config/config-controller.js
      - core/ui-src/js/config/config-service.js
    target: core/ui-react/src/features/config; core/ui-react/src/api/config
    consumers:
      - F-CONFIG-SHELL
      - F-CONFIG-MAIN
      - F-CONFIG-AUTH
      - F-CONFIG-SEARCHING
      - F-CONFIG-CATEGORIES
      - F-CONFIG-DOWNLOADING
      - F-CONFIG-EXTERNAL-TOOLS
      - F-CONFIG-INDEXERS
      - F-CONFIG-NOTIFICATIONS
    classification: feature_specific
    state: done
  - id: C-CONFIG-FIELDS
    responsibility: The small typed config field vocabulary ADR-0002 requires instead of a generic schema framework -- a labelled setting row with help, tooltip, and advanced gating, a fieldset, the scalar controls (text, multiline text,
      number, switch, select, multiselect, chips), the API-key generator, the server-side file/folder picker, a static help block for a standalone panel of prose lines with no bound value (legacy's `help` field type), and a repeat/list
      section that adds, edits, and removes array entries in place (legacy's `repeatSection.html`, not a modal), optionally adding them from a menu of choices so a new entry is seeded from the picked choice (legacy's `addNew(preset)`,
      which `notificationRepeatSection.html` renders as a dropdown), all bound through `C-CONFIG-FORM`. Every control kind emits its `data-testid` from the setting's config path with the dots replaced by
      dashes (`main.logging.logGc` -> `config-input-main-logging-logGc`; a repeat section's entries add `config-repeat-<path>`, `config-repeat-entry-<path>-<index>`, `config-repeat-add-<path>`, `config-repeat-remove-<path>-<index>`, and
      `config-repeat-add-option-<path>-<choice>` for a menu choice), so a consuming tab predicts its selectors without a lookup table; `F-CONFIG-MAIN`'s `selectors` in `FEATURES.yaml` names the seven scalar-control prefixes in full,
      `F-CONFIG-AUTH`'s names the repeat-section ones, `F-CONFIG-CATEGORIES`'s names the help-block one, and `F-CONFIG-NOTIFICATIONS`'s names the add-choice one. The number control also carries legacy's `max` and a decimal `step`
      (`formly-config.js` `percentInput`), each with a message legacy never declared -- added by FM-063 for `loadLimitInternal` and `duplicateSizeThresholdInPercent`. The repeat/list section stays the in-place editor, so a list whose entries
      are edited through a modal transaction is not this component (see `F-CONFIG-SEARCHING`'s custom mappings and `F-CONFIG-DOWNLOADING`'s downloader list, each of which owns its own section). The control kinds themselves are reusable
      inside such a transaction -- they bind through whichever React Hook Form is nearest in context, so FM-064's edit dialog renders them over its own throwaway draft form without any of them reaching `C-CONFIG-FORM`. FM-066 added three
      optional properties, each carrying a legacy template option the vocabulary had no word for and each defaulting to the previous behaviour -- the help block takes a `severity` (legacy's `templateOptions.class`, so the indexer box can
      render the same block as a danger or a warning alert), the chips control takes `suggestions` (legacy's `typeaheadSource`, used only by the indexer group names and filtered against the values already held), and the multiselect takes an
      `emptyLabel` (legacy's `settings.noSelectedText`, which is "None/All" and "All" for the indexer category lists because selecting nothing there means everything). FM-107 added a fourth
      of the same additive kind -- the chips control takes a `validateChip`, a gate run over one entry *as it is typed*. A refused entry never becomes a chip and the row shows the validator's own message, while an entry already in the value
      is flagged in place and never filtered out, because the only consumer's shape (`F-CONFIG-CATEGORIES`'s digits-only newznab tokens) is narrower than what the backend deserializer accepts and silently dropping a stored value would turn
      that narrowing into data loss. It is deliberately *not* the whole-value `validate` this control still `Omit`s -- it never reaches `settingRules`, so it does not decide whether the form may be saved -- and with the property absent, which
      is every one of the five other chips call sites, the control renders and behaves exactly as it did before, MUI's own tag rendering included. An enum-valued switch is *not* part of the vocabulary -- `F-CONFIG-INDEXERS`'
      state control owns its four-value `IndexerConfig.State` and the reason-for-being-off caption that goes with it. Advanced gating is a *disclosure* since FM-098 rather than a silent drop -- a row keeps rendering nothing while the
      global toggle hides it but stays mounted and registers with its fieldset, so the fieldset offers `config-advanced-expander-<label>` ("N advanced settings hidden") and reveals those rows in place, an advanced fieldset offers
      itself by name under the same selector instead of vanishing, and a row revealed through its fieldset's expander carries an "Advanced" chip (`config-advanced-chip-<path>`) -- ADR-0027 keeps the chip out of the toggle-on state, where
      an unflagged row in a wholly-advanced fieldset would misread as not advanced, so toggle-on rendering stays pixel-identical with the pre-FM-098 baseline. The count is derived from live registrations on every render, never memoized,
      because `useWatch`-gated advanced rows mount and unmount while the tab is open. An advanced `HelpBlock`, and an advanced row outside any fieldset, are the documented boundary -- both stay hidden outright. FM-102 has every
      `ConfigFieldset` self-register its own `<fieldset>` element -- while that element is actually mounted, so a whole advanced fieldset collapsed behind its expander contributes no entry until revealed -- with `F-CONFIG-SHELL`'s
      registry (`core/ui-react/src/features/config/fieldsetNav.ts`), which `ConfigNav.tsx` renders as ADR-0028's "on this page" list; order is derived from live DOM position on every change rather than trusted from registration
      sequence, since a conditionally mounted fieldset's effect commits after ones already on screen while sitting earlier in the tab's JSX. FM-117 changed how every one of these controls is *painted*, and did it entirely in
      `core/ui-react/src/app/theme.ts` -- no control in this vocabulary gained a style of its own. A chips control is now a growing box rather than a single-line one, so a value whose chips wrap onto several rows shows all of
      them (ADR-0036); a number control renders without the native spinner arrows in both Firefox and Chromium while keeping Up/Down stepping; the outlined field's notch border is a dedicated token strong enough to be visible
      (ADR-0036), with the disabled state stepped down to the old hairline so it stays distinguishable from rest; and `palette.error.main` was raised to clear 4.5:1 as a foreground (ADR-0035), which is what the `color="error"`
      controls these tabs render take their colour from. ADR-0036's two-grounds problem is resolved in the "config tab bodies gain the `Paper` the dialogs already have" direction, so a control renders identically in a tab and in
      a dialog. That last step also flattened `MuiPaper` app-wide (it stops painting MUI's dark-mode elevation wash, without which a tab-body `Paper` would have been a *third* ground), and the review of FM-117 found the two
      surfaces that flattening left co-planar with their container -- both borderless raised `Paper`s -- namely the notification list's `Accordion` entries and MUI's `AutocompletePaper` behind every chips field and the settings search.
      Both were 1.000:1 against what they sat on. They now take the raised treatment `MuiMenu` and `MuiPopover` already had -- a `surfaces.control` fill at 1.070:1 with a `surfaces.hairline` edge at 1.465:1, above the 1.294:1
      the pre-FM-117 elevation wash gave them -- so "a raised surface in this application looks like this" has one answer. An option-less suggestion paper is hidden while empty, because a filled, bordered one painted a 2px strip
      under the field where the borderless one had shown nothing. FM-120 changed the registering effect in `ConfigFieldset.tsx` from `useEffect` to `useLayoutEffect`, a timing fix rather than a contract change -- what gets registered, and
      under what conditions (`fieldsetNode` non-null and not `collapsed`), is untouched, and the callback-ref-into-state mechanism the comment above it documents (guarding against `Collapse`'s `unmountOnExit` outliving a stale ref) still
      applies unchanged. A passive effect's cleanup and setup are both deferred to the same macrotask, scheduled after the browser has already had a chance to paint the commit that swapped tabs, which is exactly the frame in which the
      outgoing tab's fieldsets had unregistered (or the route had already swapped) while the incoming tab's had not yet registered -- `ConfigNav.tsx`'s "on this page" list would flicker empty, or briefly show the outgoing tab's entries under
      the incoming tab's heading. `useLayoutEffect`'s cleanup and setup run synchronously within the commit itself, before paint, which closes that window.
    legacy:
      - core/ui-src/js/config/formly-config.js
      - core/ui-src/html/states/config.html
      - core/ui-src/js/file-selection-service.js
