          status: proposed
        - description: "The mock realizes refine-surface visibility as one `showFilters` boolean gating whether its `<aside>` renders at all. React realizes it as two per-branch mechanisms instead, exactly one of which is ever mounted: at the stacking threshold and up the persisted `sidebarCollapsed` preference (the docked column), and below it a transient, unpersisted drawer-open state. FM-045's reason, unchanged by FM-041's lift of that state's owner from `RefineSidebar.tsx` into `SearchResults.tsx`: a persisted expanded preference must not pop an overlay over the results when a desktop user reopens the page on a phone. The mock has no responsive branch, so it never had to answer this. The `refine-sidebar-expanded`, `refine-sidebar-collapsed`, and `refine-sidebar-mobile-drawer` states above already record the two mechanisms as distinct states; FM-041's `display-options` \"Show refine sidebar\" entry reads and writes whichever one is live, resolved from the same single `useCompactRefineSurface()` definition `RefineSidebar` itself uses, so the entry can never disagree with the live `refine-sidebar-toggle`. FM-042 (ADR-0011) moved that shared definition's own threshold from MUI's `sm` (600px) to a raw 768px query (`theme.breakpoints.down(768)`, legacy's measured 767px stacking point) -- the mechanism and this variance's reasoning are otherwise unchanged. Merging the two states, or a mount-time guard forcing one from the other, would be a product decision requiring an ADR and is deliberately not done."
          status: proposed
