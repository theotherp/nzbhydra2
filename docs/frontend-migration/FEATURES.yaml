schema_version: 2
features:
  - id: F-PLATFORM-SHELL
    name: Application shell, navigation, footer, and permission-aware links
    routes:
      - /*
    legacy_sources:
      - core/ui-src/js/nzbhydra.js
      - core/ui-src/js/header-controller.js
      - core/ui-src/html/states/header.html
      - core/ui-src/js/directives/footer.js
    target: core/ui-react/src/app
    tests:
      - core/ui-react/src/app/AppShell.test.tsx
      - tests/system/tests/smoke.spec.ts
    selectors:
      - app-shell-logo
      - app-shell-nav
      - shell-loginout
    parity: partial
    gaps:
      # 2026-08-23: `navigation` and `live status` removed. They were never
      # gaps -- `26648aff5` (the governance compaction) decomposed this
      # record's own *name* ("Application shell, navigation, footer, and
      # permission-aware links") into gap entries; `footer` and
      # `permission-aware links` were cleared earlier, these two were missed.
      # The downloader-status footer entry went with them: it named FM-081 as
      # the task that would migrate `downloaderStatusFooter.js`, and FM-081
      # shipped it (STATUS.md, `C-DOWNLOADER-STATUS`), so the line described
      # a forward reference that had already been discharged.
      - deliberate - FM-080 reproduces `footer.js`'s content-padding compensation for the update banners it added by measuring their real rendered height rather than legacy's pixel bookkeeping, per ADR-0014
  - id: F-AUTH-LOGIN
    name: Form login, logout, password confirmation, and session refresh
    routes:
      - /login
    legacy_sources:
      - core/ui-src/js/login-controller.js
      - core/ui-src/js/hydra-auth-service.js
      - core/ui-src/html/states/login.html
    target: core/ui-react/src/features/auth
    tests:
      - core/ui-react/src/features/auth/LoginPage.test.tsx
      - core/ui-react/src/features/auth/LoginOutButton.test.tsx
      - core/ui-react/src/features/auth/session.test.ts
      - core/ui-react/src/router.test.tsx
      - core/ui-react/src/app/AppShell.test.tsx
      - tests/system/tests/smoke.spec.ts
    selectors:
      - login-username
      - login-password
      - login-submit
      - shell-loginout
    parity: partial
    gaps:
      - deliberate - OpenID Connect sign-in; login.html/login-controller.js carry no OIDC affordance in the legacy SPA, sign-in happens entirely in server-side redirects the SPA never renders
      - deliberate - every session transition re-enters the application through a full document navigation, because the route tree, the navigation, and the affordance itself are built once from the server-rendered bootstrap (ADR-0017 keeps only the safe config reactive); legacy changed state in place
      - deliberate - legacy's post-logout toasts ("Logged out", "Logged out. Close your browser to make sure session is closed.") and its post-BASIC-challenge "Login successful!" are not shown, because the full navigation that follows discards them
      - deliberate - the anonymous affordance is not suppressed for the rest of the page's life after a logout (legacy's `event !== "loggedOut"` branch); the next page's bootstrap decides instead
      - deliberate - the user name for a BASIC challenge's `old_username` is carried across the full navigation in session storage; legacy kept it in the header controller's scope, which a navigation would have discarded
      - deliberate - a failed logout or BASIC challenge is reported as a "Logout failed!"/"Login failed!" toast; legacy left both to the global HTTP error growl the React app has no equivalent of
      - deliberate - the login form's two placeholder-only inputs carry visible MUI labels (ADR-0014)
      - "deliberate - logging out of a BASIC session does not end it (verified live): the browser replays the cached `Authorization` header on the full navigation that follows the logout, so the server renders an authenticated bootstrap again and the header still reads `Logout {username}`. Legacy could not end the session either, but hid the affordance in place and so at least looked logged out. Recorded as a permanent shared limitation, not a React gap: `POST /loggedout` (`MainWeb.java:92`) is dead server code no UI has ever called — a case-insensitive sweep of `core/ui-src` finds only AngularJS `user:loggedOut` *events*, never the endpoint — so this is not an endpoint React failed to adopt. React already implements legacy's actual BASIC mechanism (`session.ts`'s `askForPassword` -> `internalapi/askpassword?old_username=`). Owner ruling 2026-08-23."
  - id: F-SEARCH-FORM
    name: Search workspace, URL criteria, categories, limits, and submission
    routes:
      - /
    legacy_sources:
      - core/ui-src/js/search-controller.js
      - core/ui-src/js/search-request-service.js
      - core/ui-src/html/states/search.html
    target: core/ui-react/src/features/search
    tests:
      - core/ui-react/src/features/search/SearchPage.test.tsx
      - core/ui-react/src/features/search/workspace/SearchWorkspace.test.tsx
      - tests/system/tests/smoke.spec.ts
      - tests/system/tests/search.spec.ts
    selectors:
      - search-query
      - search-submit
      - search-category-control
      - search-category-option-{{category.name}}
      - additional-query
      - autocomplete-popup
      - autocomplete-option
      - search-advanced-toggle
      - search-advanced-panel
      # FM-087's constraint-chip row: the live status chips the search bar
      # renders for constraints whose fields sit inside the Advanced panel.
      - search-chips
      - search-chip-age
      - search-chip-size
    parity: partial
    gaps:
      - "deliberate - the guided tour is retired rather than migrated. ADR-0022 (accepted 2026-08-22) withdraws legacy's `angular-ui-tour` walkthrough instead of reproducing it, and FM-095 removed the AngularJS sources it lived in (`guided-tour-service.js`, `angular-ui-tour.js`). Its backend surface (`GuidedTourWeb`/`DemoDataProvider`) is deliberately left standing; ADR-0022 defers that removal and no FM packet may take it."
  - id: F-SEARCH-MEDIA
    name: Movie and TV autocomplete, identifiers, title refinement, season, and episode
    routes:
      - /
    legacy_sources:
      - core/ui-src/js/search-controller.js
      - core/ui-src/html/states/search.html
    target: core/ui-react/src/features/search
    tests:
      - core/ui-react/src/api/media.test.ts
      - core/ui-react/src/features/search/workspace/SearchWorkspace.test.tsx
      - core/ui-react/src/features/search/SearchPage.test.tsx
      - tests/system/tests/search.spec.ts
    selectors:
      - additional-query
      - autocomplete-popup
      - autocomplete-option
      - season-episode-pair
      # FM-087's constraint chips for the media criteria.
      - search-chip-title
      - search-chip-season
      - search-chip-episode
      - search-chip-filter
    parity: partial
  - id: F-SEARCH-INDEXERS
    name: Indexer selection by individual source, type, group, and preselection
    routes:
      - /
    legacy_sources:
      - core/ui-src/js/search-controller.js
      - core/ui-src/js/directives/multiselect-dropdown.js
      - core/ui-src/html/states/search.html
    target: core/ui-react/src/features/search
    tests:
      - tests/system/tests/search.spec.ts
      - core/ui-react/src/features/search/workspace/SearchWorkspace.test.tsx
    selectors:
      # FM-087's indexer-count chip (warning-coloured while nothing is
      # selected); the selection itself carries no test id of its own.
      - search-chip-indexers
    parity: partial
    gaps:
      - deliberate - the search form's indexer-selection checkboxes are not tinted with the indexer's configured colour (legacy's `indexer-input.js:41-42`); the owner named result rows for FM-096, and the setting's help text promises only search results
  - id: F-SEARCH-RECENT
    name: Recent-search dropdown, refill, repeat, and drag-to-search
    routes:
      - /
    legacy_sources:
      - core/ui-src/js/search-controller.js
      - core/ui-src/js/search-history-service.js
      - core/ui-src/html/search-searchhistory-dropdown.html
    target: core/ui-react/src/features/search
    tests:
      - core/ui-react/src/api/recentSearches.test.ts
      - core/ui-react/src/features/search/history/RecentSearches.test.tsx
      - core/ui-react/src/features/search/SearchPage.test.tsx
      - tests/system/tests/search.spec.ts
    selectors: []
    parity: partial
    gaps:
      - keyboard-refill hint and aria-keyshortcuts announcement not yet verified with a real screen reader (NVDA/JAWS/VoiceOver)
  - id: F-SEARCH-PROGRESS
    name: Live search progress, cancellation, and early result display
    routes:
      - /
    legacy_sources:
      - core/ui-src/js/search-controller.js
      - core/ui-src/js/search-service.js
      - core/ui-src/html/search-state.html
    target: core/ui-react/src/features/search
    tests:
      - tests/system/tests/search.spec.ts
    selectors:
      - search-status-modal
    parity: done
    gaps:
      - deliberate - Cancel does not send a server-side cancellation request;
        the backend keeps searching after the client abandons the submission.
        Its own text already said "legacy parity — only the client stops
        waiting", i.e. legacy behaves identically; reclassified 2026-08-23
        from a bare gap, which read as outstanding work.
      - deliberate - Two-button layout (separate Cancel and "Show early results" buttons)
        instead of legacy's single button that morphs from Cancel to "Show
        results" once indexers finish; recorded as deliberate by FM-083.
  - id: F-SEARCH-RESULTS
    name: Result processing, display, indexer outcomes, and malformed-result resilience
    routes:
      - /
    legacy_sources:
      - core/ui-src/js/search-results-controller.js
      - core/ui-src/js/directives/search-result.js
      - core/ui-src/html/states/search-results.html
      - core/ui-src/html/directives/search-result.html
    target: core/ui-react/src/features/search/results
    tests:
      - tests/system/tests/search.spec.ts
      - tests/system/tests/results.spec.ts
      - core/ui-react/src/features/search/results/SearchResults.test.tsx
      - core/ui-react/src/features/search/results/resultTable.test.ts
      - core/ui-react/src/features/search/results/ResultDetailLinks.test.tsx
    selectors:
      - search-results
      - indexer-limit-warnings
      - search-results-summary
      - results-rejected-trigger
      - results-rejected-popover
      - search-results-table
      - search-result-row
      - search-result-title
      - search-result-details
      - result-links
      - result-nfo
      - result-binsearch-link
      - result-comments-link
      - result-details-link
      - nfo-dialog
      - nfo-dialog-content
      - display-options-toggle
      - display-options
      - search-result-indexer-swatch
    parity: partial
    gaps:
      - deliberate - FM-096 (owner decision 2026-08-23) replaces legacy's whole-`tbody` `rgba(colour,0.5)` row tint with a bounded, outlined swatch beside the indexer name; an arbitrary user colour at 0.5 alpha behind row text cannot meet WCAG contrast on the dark palette and collides with the FM-054 recency stripe, the nested-row `action.hover` background, and the Downloaded chip
  - id: F-SEARCH-SORT-FILTER
    name: Result sorting, column filters, quick filters, and persisted choices
    routes:
      - /
    legacy_sources:
      - core/ui-src/js/search-results-controller.js
      - core/ui-src/js/directives/dataTableDirectives.js
      - core/ui-src/html/states/search-results.html
    target: core/ui-react/src/features/search/results
    tests:
      - tests/system/tests/search.spec.ts
      - tests/system/tests/results.spec.ts
      - core/ui-react/src/features/search/results/SearchResults.test.tsx
      - core/ui-react/src/features/search/results/resultTable.test.ts
      - core/ui-react/src/features/search/results/RefineSidebar.test.tsx
      - core/ui-react/src/features/search/results/groupEpisodesHelp.test.ts
    selectors:
      - sort-{{column}}
      - freetext-filter-{{column}}
      - number-filter-min-{{column}}
      - number-filter-max-{{column}}
      # number-filter-apply-{{column}} removed by FM-088: the React
      # NumericFilter's Apply button had no onClick (min/max already commit
      # on every keystroke) and was dropped. The id remains legacy-only,
      # still exercised by results.spec.ts's AngularJS-UI test at line 77.
      - number-filter-clear-{{column}}
      - filter-toggle-indexer
      - filter-toggle-category
      - filter-toggle-size
      - filter-toggle-grabs
      - filter-toggle-age
      - refine-sidebar
      - refine-sidebar-toggle
      - refine-sidebar-drawer
      - refine-sidebar-close
      - refine-clear-all
      - refine-filter-title
      - refine-quality-filters
      - refine-category-toggle
      - refine-category-list
      - refine-category-option
      - refine-indexer-toggle
      - refine-indexer-list
      - refine-indexer-option
      - refine-type-chips
      - filter-toggle-refine-size
      - filter-toggle-refine-age
      - filter-toggle-refine-grabs
      - display-options-toggle
      - display-options
      - group-episodes-help-dialog
    parity: done
    gaps:
      # 2026-08-23: narrowed from the bare phrase "server-backed preferences",
      # which overstated the gap. Legacy keeps sorting and every display
      # toggle in `localStorageService` (client-side), exactly as the React
      # results view does. Its ONLY server-backed preference in this feature
      # is the one below, adopted by FM-091 (all remaining gaps deliberate).
      - "deliberate - FM-091: the group-episodes help dialog's body drops
        legacy's \"upper left\" locator phrase for the \"Display options\"
        control (`search-results-controller.js:186`), since the React
        layout does not fix that control to a corner"
      - "deliberate - FM-091: legacy's predicate read the *searched*
        category off `$stateParams`; the React results view is only handed
        the results themselves, so eligibility is computed from the
        returned results' own categories instead
        (`groupEpisodesHelp.ts:isGroupEpisodesHelpEligible`)"
      - "deliberate - FM-091: the server-backed
        `isGroupEpisodesHelpShown` flag is written only after the dialog
        closes, not on open as legacy did
        (`search-results-controller.js:184-191`), following FM-079's
        acknowledge-after-close precedent"
      - "deliberate - FM-089: the refine sidebar's Category and Indexer
        sections now remember their own expand/collapse state
        (`refineCategoryOpen`/`refineIndexerOpen`) across reloads, folded
        into the same `hydra.search-results.table` payload
        `sidebarCollapsed` already uses; legacy had no such per-section
        memory for these two lists"
  - id: F-SEARCH-GROUP-SELECTION
