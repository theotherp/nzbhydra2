  - id: F-SEARCH-FORM
    name: Search workspace, URL criteria, categories, limits, and submission
    route_states: [ root.search ]
    routes: [ / ]
    roles: [ user ]
    legacy_sources: [ core/ui-src/js/search-controller.js, core/ui-src/js/search-request-service.js, core/ui-src/html/states/search.html ]
    tests: [ core/ui-react/src/features/search/SearchPage.test.tsx, core/ui-react/src/features/search/workspace/SearchWorkspace.test.tsx, tests/system/tests/smoke.spec.ts, tests/system/tests/search.spec.ts ]
    selectors: [ search-query, search-submit, search-category-control, "search-category-option-{{category.name}}", additional-query, autocomplete-popup, autocomplete-option, search-advanced-toggle, search-advanced-panel ]
    target: core/ui-react/src/features/search
    parity: partial
    visual:
      applicability: applicable
      status: proposed
      note: "Supersedes the prior 2026-08-16 human acceptance of this record (removed here; still recoverable from Git history) because that acceptance evidenced the FM-031 branded theme's legacy-grey palette and the always-visible age/size range grid, both of which FM-044 changes under ADR-0009. The search-bar row now renders on the mock's own #232a2c surface at its 14px 18px padding and 10px control gap, with the category select and query field at the mock's 11px radius, and the query field and its Search button form one visually joined control with the button on the new teal primary.main and the theme's textTransform: none label. The Age/Size ranges relocated out of the always-visible `workspace-ranges` grid into a new `search-advanced-toggle`/`search-advanced-panel` disclosure that defaults to collapsed, adopting the mock's own disclosure pattern; every relocated field keeps its exact `data-testid`, accessible label text, validation, and `register(...)` binding, so only default visibility and container changed and no capability was removed. This follows the accepted-claim supersession pattern FM-034, FM-037, FM-039, and FM-040 used; acceptance is never re-dated or fabricated. Pending fresh human review; see the FM-044 handoff for what changed and the verification evidence."
      contract:
        setup: React-selected `/` with deterministic mock indexers and the category catalog in `tests/system/tests/search.spec.ts`.
        states: [ search-bar-row-density, advanced-panel-collapsed, advanced-panel-expanded, terminal-submission ]
        viewports: [ { name: desktop, width: 1280, height: 800 }, { name: mobile, width: 390, height: 844 } ]
        geometry_checks:
          - "the search-bar row and the page have no horizontal overflow at 1280x800 and 390x844, the row meets the declared minimum width, and the row's computed background color is opaque and differs from the page's background.default"
          - "the Search button sits at the query field's trailing edge on the same baseline within 4px and is at least 36px high at both viewports"
          - "category precedes the primary query in the responsive hierarchy: the two share a baseline within 2px at desktop, and the category sits above the query at mobile"
          - "collapsed, the Advanced panel is not visible, its toggle reports aria-expanded=false, and the search-bar row is measurably shorter than when expanded"
          - "expanded, every relocated Age/Size field is visible with no scrollWidth overflow, and the relocated workspace-ranges region renders at least 200px wide with no region or page horizontal overflow"
          - "the workspace and its actions region meet the declared minimum widths without horizontal overflow"
      evidence: [ tests/system/tests/search.spec.ts ]
      snapshots: [ tests/system/visual-evidence/F-SEARCH-FORM/search-bar-density-desktop.png, tests/system/visual-evidence/F-SEARCH-FORM/search-bar-density-mobile.png ]
      variances: []
    gaps: [ guided tour ]
    task: FM-016
    backlog: { status: deferred, rationale: "The remaining guided-tour integration has no implementation task yet." }

  - id: F-SEARCH-MEDIA
