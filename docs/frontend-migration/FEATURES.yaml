      - news-dialog
      - user-news-dialog
      - startup-check-dialog
      # New in FM-080; legacy's checks-footer.html carries no stable selector
      # for the update banner or the automatic-update notice either.
      - update-footer
      - update-footer-install
      - update-footer-ignore
      - update-footer-changelog
      - automatic-update-footer
      # New in FM-081; legacy's downloader-status-footer.html carries only the
