  - id: F-SEARCH-RESULTS
    name: Result processing, display, indexer outcomes, and malformed-result resilience
    route_states: [ root.search.results ]
    routes: [ / ]
    roles: [ user ]
    legacy_sources: [ core/ui-src/js/search-results-controller.js, core/ui-src/js/directives/search-result.js, core/ui-src/html/states/search-results.html, core/ui-src/html/directives/search-result.html ]
    tests: [ tests/system/tests/search.spec.ts, tests/system/tests/results.spec.ts ]
    selectors: [ search-results, indexer-limit-warnings, search-results-summary, search-results-table, search-result-row, search-result-title ]
    target: core/ui-react/src/features/search/results
    parity: partial
    visual:
      applicability: applicable
      status: proposed
      note: "Supersedes the FM-039/FM-040 note (removed here; still recoverable from Git history), which itself superseded the prior 2026-08-16 human acceptance. FM-034's 1700px page container and `.result-*` column ratios remain true and unchanged, as does FM-040's bulk-actions bar inside the same `results-toolbar` region. FM-045 changes this record in two ways: the table header row no longer carries FM-034's inline per-column filter controls (only the sort button/indicator remains, and the header cells' vertical padding drops from MUI's 16px default to the body cells' 6px, so the header row is measurably shorter), and the toolbar's mobile-only `results-filters`/`results-quick-filters` rows are gone because the `refine-sidebar` is now the sole filter surface at every viewport (see `F-SEARCH-SORT-FILTER` for that contract, including its below-`sm` drawer). No result row, cell, summary, or selection behavior changed. FM-046 restyles the `results-toolbar` container itself from an elevated `Paper` (border/shadow) to the mock's flat, borderless bar at its own `16px 0 14px` padding, and adds a `· N selected` fragment to `search-results-summary` in `primary.main` once something is selected -- a pure density/palette and additive-text change with no change to the summary's existing loaded/filtered/available/rejected wording, no result row/cell behavior change, and no change to `results-selected-count`, which keeps rendering separately inside `results-bulk-actions` exactly as FM-040 left it. Pending fresh human review; see the FM-045 and FM-046 handoffs for what changed and why."
      contract:
        setup: "React-selected `ui/react?redirect=/` with a deterministic mocked `internalapi/search` response (two same-title/hash NZB duplicates plus one distinct-title NZB release) submitted through the real search form, in `tests/system/tests/results.spec.ts`."
        states: [ populated-toolbar-and-table, title-dominant-column, filtered-result-narrowing, simplified-sortable-header, refine-sidebar-expanded, refine-sidebar-collapsed, refine-sidebar-mobile-drawer, refine-counts-and-type-chips, no-selection-disabled-actions, partial-selection-indeterminate, all-selected-bulk-actions, toolbar-mock-density ]
        viewports: [ { name: desktop, width: 1280, height: 800 }, { name: mobile, width: 390, height: 844 } ]
        geometry_checks:
          - "the results-toolbar and search-results-table regions each render with no horizontal overflow at 1280x800 and 390x844, and the toolbar's bottom edge sits at or above the table's top edge"
          - "the title header column's bounding-box width exceeds twice the indexer header column's width at desktop"
          - "after a free-text title filter narrows visible rows, the results summary reflects the updated filtered count and the table/toolbar remain overflow-free"
          - "at desktop the sidebar and table both render overflow-free, the sidebar's right edge sits at or left of the table's left edge, and the title header column's width still exceeds twice the indexer header column's width"
          - "collapsing the sidebar increases the table's bounding-box width, leaves no residual gap, and is reflected by the toggle's aria-expanded"
          - "every category and indexer row renders as a single non-checkbox clickable element carrying its label and count with no scrollWidth overflow of the row"
          - "the table header row carries no inline filter control at either viewport and measures shorter at desktop than the 63.25px it measured before FM-045"
          - "at mobile no docked sidebar renders beside the table; opening refine-sidebar-toggle shows every filter section in a drawer with no page horizontal overflow, and closing it restores the table's previous mobile width and position exactly"
          - "the toolbar's new bulk-actions bar (FM-040) renders inside the same results-toolbar region this record already governs, so its bottom edge stays at or above the table's top edge, and it does not overlap the refine-sidebar at desktop"
          - "the results-toolbar element's computed box-shadow is none and border-top-width is 0px (no elevated Paper surface), and its computed padding-top/padding-bottom are 16px/14px, at both 1280x800 and 390x844"
      evidence: [ tests/system/tests/results.spec.ts ]
      variances: []
    gaps: [ ]
    task: FM-010
    backlog: { status: deferred, rationale: "The record remains partial pending a dedicated full-parity reconciliation." }

