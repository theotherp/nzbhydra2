  - id: F-SEARCH-FORM
    name: Search workspace, URL criteria, categories, limits, and submission
    route_states: [ root.search ]
    routes: [ / ]
    roles: [ user ]
    legacy_sources: [ core/ui-src/js/search-controller.js, core/ui-src/js/search-request-service.js, core/ui-src/html/states/search.html ]
    tests: [ core/ui-react/src/features/search/SearchPage.test.tsx, core/ui-react/src/features/search/workspace/SearchWorkspace.test.tsx, tests/system/tests/smoke.spec.ts, tests/system/tests/search.spec.ts ]
    selectors: [ search-query, search-submit, search-category-control, "search-category-option-{{category.name}}", additional-query, autocomplete-popup, autocomplete-option, search-advanced-toggle, search-advanced-panel ]
    target: core/ui-react/src/features/search
    parity: partial
    visual:
      applicability: applicable
      status: proposed
      note: "Supersedes the prior 2026-08-16 human acceptance of this record (removed here; still recoverable from Git history) because that acceptance evidenced the FM-031 branded theme's legacy-grey palette and the always-visible age/size range grid, both of which FM-044 changes under ADR-0009. The search-bar row now renders on the mock's own #232a2c surface at its 14px 18px padding and 10px control gap, with the category select and query field at the mock's 11px radius, and the query field and its Search button form one visually joined control with the button on the new teal primary.main and the theme's textTransform: none label. The Age/Size ranges relocated out of the always-visible `workspace-ranges` grid into a new `search-advanced-toggle`/`search-advanced-panel` disclosure that defaults to collapsed, adopting the mock's own disclosure pattern; every relocated field keeps its exact `data-testid`, accessible label text, validation, and `register(...)` binding, so only default visibility and container changed and no capability was removed. This follows the accepted-claim supersession pattern FM-034, FM-037, FM-039, and FM-040 used; acceptance is never re-dated or fabricated. Pending fresh human review; see the FM-044 handoff for what changed and the verification evidence."
      contract:
        setup: React-selected `/` with deterministic mock indexers and the category catalog in `tests/system/tests/search.spec.ts`.
        states: [ search-bar-row-density, advanced-panel-collapsed, advanced-panel-expanded, terminal-submission, keyboard-focus-indicator ]
        viewports: [ { name: desktop, width: 1280, height: 800 }, { name: mobile, width: 390, height: 844 } ]
        geometry_checks:
          - "the search-bar row and the page have no horizontal overflow at 1280x800 and 390x844, the row meets the declared minimum width, and the row's computed background color is opaque and differs from the page's background.default"
          - "the Search button sits at the query field's trailing edge on the same baseline within 4px and is at least 36px high at both viewports"
          - "category precedes the primary query in the responsive hierarchy: the two share a baseline within 2px at desktop, and the category sits above the query at mobile"
          - "collapsed, the Advanced panel is not visible, its toggle reports aria-expanded=false, and the search-bar row is measurably shorter than when expanded"
          - "expanded, every relocated Age/Size field is visible with no scrollWidth overflow, and the relocated workspace-ranges region renders at least 200px wide with no region or page horizontal overflow"
          - "the workspace and its actions region meet the declared minimum widths without horizontal overflow"
          - "FM-053 (ADR-0013): the query field, the category Select and the Advanced-panel Age/Size range fields, each reached by real Tab/Shift+Tab from a known start with no pointer interaction, render a non-empty focused/unfocused computed-style delta and the authored token `outline: 3px solid oklch(0.75 0.1 190)` at `outline-offset: 3px`; the category Select's own `notchedOutline` measures `border-width: 0px` unfocused (the mock's borderless resting rendering, preserved) and `2px` focused"
          - "FM-053 (ADR-0013): the query field's indicator changes 4833.38 px2 against its own `4(w+h)` threshold of 3150.25 px2 (control box 742.00x45.56) at 7.54:1 against rgb(28,34,36); the category Select 1293.38 px2 against 790.25 px2 at 6.83:1; the Advanced-panel range field 760.13 px2 against 434.75 px2 at 6.83:1 -- all full-opacity, none clipped by an ancestor, and none the cause of page-level horizontal overflow at either viewport"
      evidence: [ tests/system/tests/search.spec.ts, tests/system/tests/focus-indication.spec.ts ]
      snapshots: [ tests/system/visual-evidence/F-SEARCH-FORM/search-bar-density-desktop.png, tests/system/visual-evidence/F-SEARCH-FORM/search-bar-density-mobile.png, tests/system/visual-evidence/F-SEARCH-FORM/keyboard-focus-advanced-range-input-desktop.png ]
      variances:
        - description: "FM-053 (ADR-0013) focus-indicator variance from the visual reference: the ADR-0009 source mock `uimock/NZBHydra Search.dc.html` declares `outline:none` 15 times and authors no focus-state style at all -- its only `focus` occurrences are the `onFocus`/`onFocusSearch`/`searchFocused` JS bindings, confirmed first-hand by FM-053 rather than taken on trust -- so the authored keyboard focus indicator this record now renders (`outline: 3px solid oklch(0.75 0.1 190)` at a 3px offset, or -3px where an ancestor was measured clipping an outset ring) is a deliberate divergence from that reference, adopted under ADR-0013 (accepted 2026-08-19, Option A) for WCAG 2.4.7/2.4.11 rather than for mock fidelity. Requires explicit human acceptance under ADR-0006; accepting ADR-0013 is not accepting this variance."
          status: proposed
    gaps: [ guided tour ]
    task: FM-016
    backlog: { status: deferred, rationale: "The remaining guided-tour integration has no implementation task yet. FM-052 (measurement only) found two of this record's own controls render no keyboard focus indicator at all (WCAG 2.4.7): `search-query` (bare `InputBase`; `.MuiInputBase-input:focus{outline:0}` at SearchWorkspace.tsx:417-430/:375-415 defeats the global `:focus-visible` outline, and its static-bordered wrapper does not react to focus) and the Category select (`SearchWorkspace.tsx:463-513`; the same InputBase-class outline defeat, plus `& .MuiOutlinedInput-notchedOutline{border:\"none\"}` at :480-482 suppresses the fieldset border entirely). The Age/Size range fields relocated into `search-advanced-panel` share the query field's exact `InputBase` mechanism, so they fail identically; their rendering differs (`advancedInputSx` at `SearchWorkspace.tsx:99-108` adds a recessed background and a static 1px border that `queryInputSx` does not have), but that border does not react to focus, so the focused/unfocused delta is empty for both. The blocking decision is now made: ADR-0013 (`decisions/ADR-0013-application-wide-keyboard-focus-indication.md`, accepted 2026-08-19, Option A -- an explicit focus-ring token authored per control family), and FM-053 implements it. All three renderings now carry an authored focus affordance measured live at full opacity, which is why the focus `gap` phrase above is removed rather than narrowed: `theme.ts`'s `MuiInputBase` entry authors the shared token on the input root (`&:has(:focus-visible)`), reaching the bare `InputBase` renderings and every `Select` trigger alike, and `SearchWorkspace.tsx`'s `& .MuiOutlinedInput-notchedOutline{border:\"none\"}` is re-scoped to the unfocused state so the category Select's fieldset border paints again when the control is reached by keyboard. What remains outstanding is the ADR-0006 acceptance of the resulting focused state and its variance, which belongs to the repository owner alone." }

  - id: F-SEARCH-MEDIA
    name: Movie and TV autocomplete, identifiers, title refinement, season, and episode
    route_states: [ root.search ]
    routes: [ / ]
    roles: [ user ]
    legacy_sources: [ core/ui-src/js/search-controller.js, core/ui-src/html/states/search.html ]
    tests: [ core/ui-react/src/api/media.test.ts, core/ui-react/src/features/search/workspace/SearchWorkspace.test.tsx, core/ui-react/src/features/search/SearchPage.test.tsx, tests/system/tests/search.spec.ts ]
    selectors: [ additional-query, autocomplete-popup, autocomplete-option, season-episode-pair ]
    target: core/ui-react/src/features/search
    parity: partial
    visual:
      applicability: applicable
      status: proposed
      note: "Supersedes the prior 2026-08-16 human acceptance of this record (removed here; still recoverable from Git history) because that acceptance evidenced the FM-031 branded theme's palette and two independently labeled, equal-width, full-width season/episode TextFields stacked in the media-refinement grid. FM-044 replaces that pair with the mock's compact inline treatment inside the search-bar row: 40px centered IBM Plex Mono inputs behind short adjacent \"S\"/\"E\" captions, on the mock's #2a3133 control surface at its 11px radius. The autocomplete suggestion panel is likewise restyled to the mock's #2a3133/11px suggestion surface. The season and episode form fields, their numeric-only and free-text validation, their `register(...)` bindings, their accessible label text, and every autocomplete data-testid, keyboard interaction (arrow navigation, Enter-to-select, Escape-to-dismiss), and loading/empty/error Alert state are unchanged in behavior. This follows the accepted-claim supersession pattern FM-034, FM-037, FM-039, and FM-040 used; acceptance is never re-dated or fabricated. Pending fresh human review; see the FM-044 handoff."
      contract:
        setup: React-selected `/` with deterministic mock indexers; select the configured TV category in `tests/system/tests/search.spec.ts`.
        states: [ tv-title-refinement, paired-season-episode-compact, keyboard-focus-indicator ]
        viewports: [ { name: desktop, width: 1280, height: 800 }, { name: mobile, width: 390, height: 844 } ]
        geometry_checks:
          - "media refinement is visible after its category transition and meets its declared minimum width with no control or page horizontal overflow at 1280x800 and 390x844"
          - "the season/episode pair renders inside the search-bar row at no more than 220px wide with no region or page horizontal overflow, and its combined bounding-box width is less than half of the full-width additional-query field's width"
          - "both paired inputs remain individually operable by keyboard focus and typing, retaining the typed season and episode values"
          - "FM-053 (ADR-0013): the Season input, reached by real Tab/Shift+Tab from a known start with no pointer interaction, renders a non-empty focused/unfocused computed-style delta and the authored token `outline: 3px solid oklch(0.75 0.1 190)` at `outline-offset: 3px` -- this rendering declares no border of any kind and has no wrapper of its own, so before FM-053 nothing existed that could react to focus"
          - "FM-053 (ADR-0013): that indicator's changed area is 608.44 px2 against its own `4(w+h)` threshold of 333.63 px2 (control box 40.00x43.41) and its full-opacity contrast against its own composited unfocused ground rgb(42,49,51) is 6.20:1, and it is neither clipped by an ancestor nor the cause of page-level horizontal overflow"
      evidence: [ tests/system/tests/search.spec.ts, tests/system/tests/focus-indication.spec.ts ]
      snapshots: [ tests/system/visual-evidence/F-SEARCH-MEDIA/keyboard-focus-season-input-desktop.png ]
      variances:
        - description: "FM-053 (ADR-0013) focus-indicator variance from the visual reference: the ADR-0009 source mock `uimock/NZBHydra Search.dc.html` declares `outline:none` 15 times and authors no focus-state style at all -- its only `focus` occurrences are the `onFocus`/`onFocusSearch`/`searchFocused` JS bindings, confirmed first-hand by FM-053 rather than taken on trust -- so the authored keyboard focus indicator this record now renders (`outline: 3px solid oklch(0.75 0.1 190)` at a 3px offset, or -3px where an ancestor was measured clipping an outset ring) is a deliberate divergence from that reference, adopted under ADR-0013 (accepted 2026-08-19, Option A) for WCAG 2.4.7/2.4.11 rather than for mock fidelity. Requires explicit human acceptance under ADR-0006; accepting ADR-0013 is not accepting this variance."
          status: proposed
    gaps: [ ]
    task: FM-025
    backlog: { status: deferred, rationale: "The record remains partial pending a dedicated full-parity reconciliation. FM-052 (measurement only) found the paired season/episode inputs (`season-episode-pair`; `SearchWorkspace.tsx:539` and `:563`, `pairedInputSx` at `:87-97`) render no keyboard focus indicator at all (WCAG 2.4.7): they are bare `InputBase`es defeated by the same `.MuiInputBase-input:focus{outline:0}` rule as the query field, and unlike `advancedInputSx` they carry no border of any kind, so the focused/unfocused computed-style delta over the whole subtree is `outline-width: 3px -> 0px` and `outline-offset: 0px -> 3px` with `outline-style: none` in both states -- nothing paints. `additional-query` (`SearchWorkspace.tsx:785`) is a different case on the same record: it is a default, un-overridden `TextField`, so MUI's own focused `notchedOutline` still renders (measured `rgba(255,255,255,0.23)` 1px -> `oklch(0.75 0.1 190)` 2px, contrast 3.15:1) and it meets 2.4.7 while failing 2.4.11 on area. The blocking decision is now made: ADR-0013 (`decisions/ADR-0013-application-wide-keyboard-focus-indication.md`, accepted 2026-08-19, Option A -- an explicit focus-ring token authored per control family), and FM-053 implements it. Both controls now carry the same authored token from `theme.ts`'s `MuiInputBase` entry, measured live at full opacity (Season 608.44 px2 against a 333.63 px2 threshold at 6.20:1; `additional-query` is the same un-overridden `OutlinedInput` rendering as the search-history filters, measured on that record), which is why the focus `gap` phrase above is removed rather than narrowed. What remains outstanding is the ADR-0006 acceptance of the resulting focused state and its variance, which belongs to the repository owner alone." }

  - id: F-SEARCH-INDEXERS
    name: Indexer selection by individual source, type, group, and preselection
    route_states: [ root.search ]
    routes: [ / ]
    roles: [ user ]
    legacy_sources: [ core/ui-src/js/search-controller.js, core/ui-src/js/directives/multiselect-dropdown.js, core/ui-src/html/states/search.html ]
    tests: [ tests/system/tests/search.spec.ts, core/ui-react/src/features/search/workspace/SearchWorkspace.test.tsx ]
    selectors: [ ]
    target: core/ui-react/src/features/search
    parity: partial
    visual:
      applicability: applicable
      status: proposed
      note: "Supersedes the prior 2026-08-16 human acceptance of this record (removed here; still recoverable from Git history) because FM-037 restructured indexer bulk-action selection from N always-visible flat buttons into a single
        legacy-shaped split button (default \"Invert selection\") plus an on-demand dropdown menu holding the remaining bulk actions, materially changing the reviewed geometry. The dropdown's \"Indexer groups\" subsection is legacy
        parity, not a novel addition (`core/ui-src/js/search-controller.js`'s `buildGroupSelectionActions`, rendered by `search.html`'s own split button and `multiselect-dropdown.html`); no `indexer_groups` variance is recorded. Pending
        fresh human review; see the FM-037 handoff for what changed and why. FM-044 additionally restyles this control and the checkbox-mode indexer list to the mock's design language under ADR-0009 -- split-button and dropdown-menu
        surfaces on the mock's #2a3133 control surface with its 11px menu radius, teal `primary.main` hover/active affordances, and the theme's own button radius and `textTransform: none` -- which is ADR-0009's named example of
        extending that language to a control the mock itself does not show. FM-044 changes no action, order, icon, or accessibility semantics (`aria-haspopup`, `aria-expanded`, `role=\"menu\"`/`\"menuitem\"`), and does not re-litigate
        FM-037's structural claim above; the states, viewports, and geometry checks below are unchanged and were re-evidenced by FM-044's own visual-evidence run."
      contract:
