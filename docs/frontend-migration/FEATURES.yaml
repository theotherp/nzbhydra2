      - core/ui-src/js/directives/search-result.js
      - core/ui-src/js/directives/selection-button.js
    target: core/ui-react/src/features/search/results
    tests:
      - tests/system/tests/results.spec.ts
      - core/ui-react/src/features/search/results/SearchResults.test.tsx
    selectors:
      - search-result-row
      - results-bulk-actions
      - header-selection-menu
      - toolbar-selection-menu
      - display-options-toggle
      - display-options
