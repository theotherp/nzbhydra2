          - "FM-053 (ADR-0013): a sortable column header's sort button, reached by real Tab/Shift+Tab from a known start with no pointer interaction, renders a non-empty focused/unfocused computed-style delta and the authored token `outline: 3px solid oklch(0.75 0.1 190)` at `outline-offset: 3px`, inside the sticky table header"
          - "FM-053 (ADR-0013): that indicator's changed area is 538.50 px2 against its own `4(w+h)` threshold of 287.00 px2 (control box 44.50x27.25) and its full-opacity contrast against its own composited unfocused ground rgb(31,36,38) is 7.34:1; measured inside the results table rows and the sticky header specifically, it is neither clipped by the header cell nor the cause of page-level horizontal overflow at either viewport"
