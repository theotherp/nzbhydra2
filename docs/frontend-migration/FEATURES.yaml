et results\" and \"Group TV episodes\") out of the inline `results-selection-actions` row and into the new `display-options` popover, with their labels, defaults (off and on respectively), and grouping behavior unchanged -- the same shape the legacy AngularJS view already used for them (`core/ui-src/js/search-results-controller.js`'s `optionsOptions`, rendered as `search-results.html`'s `id=\"display-options\"` \"Display options\" dropdown), so this is a relocation toward legacy parity rather than a new divergence. `results-selection-actions` keeps its `data-testid` and now carries the mobile-reachable `toolbar-selection-menu` copy plus the right-aligned `display-options-toggle`; no selection semantics, outcome, or `data-testid` changed. Pending fresh human review; see the FM-040, FM-046, and FM-041 handoffs for what changed and why."
