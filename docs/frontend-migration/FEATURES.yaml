      - deliberate - an empty "Hit reset time" is valid; legacy's timeOfDay validator rejects the empty value its own help text recommends for a rolling counter
      - deliberate - a successful capability check writes back only updateIndexerModel's nine fields, not the server's whole IndexerConfig, because the response carries credentials resolved from the ***UNCHANGED*** markers
      - deliberate - name uniqueness is checked against the other indexers; legacy's expression compares the typed value with the two-way-bound model, so renaming an existing indexer onto another's name was never rejected
      - deliberate - a picked preset's `info` prose is passed to the dialog rather than merged into the entry; legacy extends the model with it and writes an `info` key the backend has no field for into the saved config
      - deliberate - the list is a table with a name filter, header sorting, and bulk enable/disable over the shown rows (FM-103); legacy has a fixed stack in one order with no filter, sort, or bulk state action
      - deliberate - a bulk enable skips an entry whose configuration is incomplete, exactly as that entry's own state switch refuses to be operated; legacy has no bulk state action at all
      - deliberate - a sort by a column that is also inline-editable (state, priority) is deferred while a control in the table has focus, so a row does not move out from under an edit in progress; legacy's orderBy re-sorted on every keystroke
      - deliberate - the search-source select is on the list without being gated by the advanced toggle, though the same field is advanced inside the edit dialog; a column the toggle empties would leave a headed blank cell in every row
      - deliberate - neither the filter nor the sort is persisted; both are momentary view state, as the packet scopes them
      - deliberate - below sm the table keeps one column and each entry stacks, with sorting moved to a named "Sort by" select, because five columns need about 900px and even three overflow a 390px phone once a VIP-expiry chip or the search-source control is in one of them (ADR-0029; measured, not estimated)
      - deliberate - the add surface is a filterable, grouped gallery with every preset a directly clickable item (FM-104), replacing legacy's two "Choose from presets" anchor menus; filtering is a substring match over the label and never reorders, and a group with no matches hides its own heading rather than showing an empty one
