    route_states: [ root.search ]
    routes: [ / ]
    roles: [ user ]
    legacy_sources: [ core/ui-src/js/search-controller.js, core/ui-src/html/states/search.html ]
    tests: [ core/ui-react/src/api/media.test.ts, core/ui-react/src/features/search/workspace/SearchWorkspace.test.tsx, core/ui-react/src/features/search/SearchPage.test.tsx, tests/system/tests/search.spec.ts ]
    selectors: [ additional-query, autocomplete-popup, autocomplete-option, season-episode-pair ]
    target: core/ui-react/src/features/search
    parity: partial
    visual:
      applicability: applicable
      status: proposed
      note: "Supersedes the prior 2026-08-16 human acceptance of this record (removed here; still recoverable from Git history) because that acceptance evidenced the FM-031 branded theme's palette and two independently labeled, equal-width, full-width season/episode TextFields stacked in the media-refinement grid. FM-044 replaces that pair with the mock's compact inline treatment inside the search-bar row: 40px centered IBM Plex Mono inputs behind short adjacent \"S\"/\"E\" captions, on the mock's #2a3133 control surface at its 11px radius. The autocomplete suggestion panel is likewise restyled to the mock's #2a3133/11px suggestion surface. The season and episode form fields, their numeric-only and free-text validation, their `register(...)` bindings, their accessible label text, and every autocomplete data-testid, keyboard interaction (arrow navigation, Enter-to-select, Escape-to-dismiss), and loading/empty/error Alert state are unchanged in behavior. This follows the accepted-claim supersession pattern FM-034, FM-037, FM-039, and FM-040 used; acceptance is never re-dated or fabricated. Pending fresh human review; see the FM-044 handoff."
      contract:
        setup: React-selected `/` with deterministic mock indexers; select the configured TV category in `tests/system/tests/search.spec.ts`.
        states: [ tv-title-refinement, paired-season-episode-compact ]
        viewports: [ { name: desktop, width: 1280, height: 800 }, { name: mobile, width: 390, height: 844 } ]
        geometry_checks:
          - "media refinement is visible after its category transition and meets its declared minimum width with no control or page horizontal overflow at 1280x800 and 390x844"
          - "the season/episode pair renders inside the search-bar row at no more than 220px wide with no region or page horizontal overflow, and its combined bounding-box width is less than half of the full-width additional-query field's width"
          - "both paired inputs remain individually operable by keyboard focus and typing, retaining the typed season and episode values"
      evidence: [ tests/system/tests/search.spec.ts ]
      variances: []
    gaps: [ ]
    task: FM-025
    backlog: { status: deferred, rationale: "The record remains partial pending a dedicated full-parity reconciliation." }

  - id: F-SEARCH-INDEXERS
    name: Indexer selection by individual source, type, group, and preselection
    route_states: [ root.search ]
    routes: [ / ]
    roles: [ user ]
    legacy_sources: [ core/ui-src/js/search-controller.js, core/ui-src/js/directives/multiselect-dropdown.js, core/ui-src/html/states/search.html ]
    tests: [ tests/system/tests/search.spec.ts, core/ui-react/src/features/search/workspace/SearchWorkspace.test.tsx ]
    selectors: [ ]
    target: core/ui-react/src/features/search
    parity: partial
    visual:
      applicability: applicable
      status: proposed
      note: "Supersedes the prior 2026-08-16 human acceptance of this record (removed here; still recoverable from Git history) because FM-037 restructured indexer bulk-action selection from N always-visible flat buttons into a single
        legacy-shaped split button (default \"Invert selection\") plus an on-demand dropdown menu holding the remaining bulk actions, materially changing the reviewed geometry. The dropdown's \"Indexer groups\" subsection is legacy
        parity, not a novel addition (`core/ui-src/js/search-controller.js`'s `buildGroupSelectionActions`, rendered by `search.html`'s own split button and `multiselect-dropdown.html`); no `indexer_groups` variance is recorded. Pending
        fresh human review; see the FM-037 handoff for what changed and why. FM-044 additionally restyles this control and the checkbox-mode indexer list to the mock's design language under ADR-0009 -- split-button and dropdown-menu
        surfaces on the mock's #2a3133 control surface with its 11px menu radius, teal `primary.main` hover/active affordances, and the theme's own button radius and `textTransform: none` -- which is ADR-0009's named example of
        extending that language to a control the mock itself does not show. FM-044 changes no action, order, icon, or accessibility semantics (`aria-haspopup`, `aria-expanded`, `role=\"menu\"`/`\"menuitem\"`), and does not re-litigate
        FM-037's structural claim above; the states, viewports, and geometry checks below are unchanged and were re-evidenced by FM-044's own visual-evidence run."
      contract:
        setup: React-selected `/` with deterministic mock indexers, first using dropdown selection then saved safe configuration checkbox selection, then opening the indexer bulk-action split button's dropdown menu, in `tests/system/tests/search.spec.ts`.
        states: [ dropdown-indexers, checkbox-indexers, bulk-indexer-actions ]
        viewports: [ { name: desktop, width: 1280, height: 800 }, { name: mobile, width: 390, height: 844 } ]
        geometry_checks:
          - "dropdown indexer control spans its workspace region"
          - "checkbox indexer region is visible at desktop"
          - "indexer controls and page have no horizontal overflow"
          - "the indexer bulk-action split button is contained within the workspace indexer region, and its open dropdown menu renders with no menu or page horizontal overflow, at both desktop and mobile"
      evidence: [ tests/system/tests/search.spec.ts ]
      variances: []
    gaps: [ ]
    task: FM-016
    backlog: { status: deferred, rationale: "The record remains partial pending a dedicated full-parity reconciliation." }

  - id: F-SEARCH-RECENT
    name: Recent-search dropdown, refill, repeat, and drag-to-search
    route_states: [ root.search ]
    routes: [ / ]
    roles: [ user ]
    legacy_sources: [ core/ui-src/js/search-controller.js, core/ui-src/js/search-history-service.js, core/ui-src/html/search-searchhistory-dropdown.html ]
    tests: [ core/ui-react/src/api/recentSearches.test.ts, core/ui-react/src/features/search/history/RecentSearches.test.tsx, core/ui-react/src/features/search/SearchPage.test.tsx, tests/system/tests/search.spec.ts ]
    selectors: [ ]
    target: core/ui-react/src/features/search
    parity: partial
    visual:
      applicability: applicable
      status: proposed
      note: "Supersedes the prior 2026-08-16 human acceptance of this record (removed here; still recoverable from Git history) because it evidenced a narrower, now-changed layout: FM-038 removed the populated recent-search menu's 240px-to-420px desktop width cap (the fixed-width menu paper and its mobile-only calc(100vw - 32px) rule) on the user's explicit instruction, given directly in the live session that produced this implementation, that every recent-search entry be shown in full rather than wrapped or truncated; the menu now sizes to its content, bounded only by calc(100vw - 32px) at both viewports, which real multi-field entries routinely exceed 420px. The same change also collapsed the two-menuitem row (a separate `menuitem` for Refill and one for Repeat) into one `menuitem` per search carrying the accessible name `Repeat: <description>`, with a leading icon button carrying `Refill: <description>` preserving the refill capability. This follows the same accepted-claim supersession pattern FM-034 used for F-SEARCH-RESULTS and F-SEARCH-SORT-FILTER. Pending fresh human review; see the FM-038 handoff for what changed and the verification evidence."
      contract:
        setup: React-selected `/` with deterministic mock indexers and search history enabled; submit `visual recent history` then open the recent-search trigger in `tests/system/tests/search.spec.ts`.
        states: [ history-trigger, populated-anchored-menu, single-row-entry-with-leading-refill-button, content-driven-menu-width, pointer-drag-refill ]
        viewports: [ { name: desktop, width: 1280, height: 800 }, { name: mobile, width: 390, height: 844 } ]
        geometry_checks:
          - "trigger is contained in workspace actions"
          - "populated menu is anchored, no longer capped at a fixed maximum width, retains its prior minimum width of 240px at desktop, and is bounded only by the viewport-derived maximum of viewport width minus 32px (calc(100vw - 32px); 1248px at the 1280x800 desktop fixture viewport)"
          - "menu and page have no horizontal overflow"
      evidence: [ tests/system/tests/search.spec.ts ]
      variances: []
    gaps: [ ]
    task: FM-017
    backlog: { status: deferred, rationale: "Visual parity remains proposed, pending fresh human acceptance under ADR-0006 after FM-038 superseded the prior accepted width contract." }

