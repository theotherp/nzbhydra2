    legacy_sources:
      - core/ui-src/js/nzb-download-service.js
      - core/ui-src/js/directives/addable-nzb.js
      - core/ui-src/js/directives/download-nzbs-button.js
      - core/ui-src/js/directives/download-nzbzip-button.js
      - core/ui-src/js/directives/copy-links-button.js
      - core/ui-src/js/directives/save-or-send-torrent.js
    target: core/ui-react/src/features/search/results
    tests:
      - tests/system/tests/downloads.spec.ts
      - tests/system/tests/results.spec.ts
      - core/ui-react/src/features/search/results/SearchResults.test.tsx
    selectors:
      - send-to-downloader
      - download-nzb
      - results-bulk-actions
    parity: partial
    # 2026-08-23: `download-history route migration` removed -- that route is
    # its own record now (`F-HISTORY-DOWNLOADS`) and is migrated, so the entry
    # claimed missing capability that exists.
  - id: F-SEARCH-PAGING
    name: Load next batch or all remaining indexer results without repeating offsets
    routes:
      - /
    legacy_sources:
      - core/ui-src/js/search-results-controller.js
      - core/ui-src/js/search-service.js
      - core/ui-src/html/states/search-results.html
    target: core/ui-react/src/features/search/results
    tests:
      - core/ui-react/src/api/search.test.ts
      - core/ui-react/src/features/search/SearchPage.test.tsx
      - core/ui-react/src/features/search/results/SearchResults.test.tsx
      - tests/system/tests/results.spec.ts
      - tests/system/tests/focus-indication.spec.ts
    selectors:
      - results-load-more
      - results-load-all
    parity: partial
  - id: F-SEARCH-SAVED
    name: Save an executed search for later reuse
    routes:
      - /
      - /stats/saved-searches
    legacy_sources:
      - core/ui-src/js/search-results-controller.js
      - core/ui-src/js/saved-searches-controller.js
      - core/ui-src/html/states/saved-searches.html
    target: core/ui-react/src/features/search
    tests:
      - core/ui-react/src/api/savedSearches.test.ts
      - core/ui-react/src/features/search/history/savedSearchCriteria.test.ts
      - tests/system/tests/search.spec.ts
    selectors: []
    parity: partial
  - id: F-SEARCH-TOUR
    name: Guided search tour and demo-mode lifecycle
    routes:
      - /
    legacy_sources:
      - core/ui-src/js/search-controller.js
      - core/ui-src/js/guided-tour-service.js
      - core/ui-src/js/angular-ui-tour.js
    target: null
    tests: []
    selectors: []
    parity: retired
    gaps:
      - deliberate - the guided search tour and demo mode are retired, not reproduced in React (ADR-0022); the legacy implementation is ~2,300 lines of cross-state step choreography and vendored `angular-ui-tour.js` that does not port mechanically, and no React tour or demo mode is built
  - id: F-CONFIG-SHELL
    name: Configuration settings navigation, advanced fields, whole-config save, validation, dirty state, and API help
    routes:
      - /config
    legacy_sources:
      - core/ui-src/js/nzbhydra.js
      - core/ui-src/js/config/config-controller.js
      - core/ui-src/js/config/config-service.js
      - core/ui-src/html/states/config.html
    target: core/ui-react/src/features/config
    tests:
      - tests/system/tests/config.spec.ts
      - tests/system/tests/config-control-treatment.spec.ts
      - tests/system/tests/external-tools.spec.ts
      - core/ui-react/src/features/config/ConfigShell.test.tsx
      - core/ui-react/src/features/config/ConfigFeedbackBanner.test.tsx
      - core/ui-react/src/features/config/configFormState.test.ts
      - core/ui-react/src/features/config/fieldsetNav.test.tsx
      - core/ui-react/src/features/config/settingsSearch/settingsIndex.test.ts
      - core/ui-react/src/features/config/settingsSearch/settingsIndexDrift.test.tsx
      - core/ui-react/src/features/config/reviewChanges/reviewChangesDiff.test.ts
      - core/ui-react/src/router.test.tsx
    selectors:
      # FM-097: the per-section badges follow the tab's own URL segment --
      # `config-nav-dirty-<tab>` (unsaved changes in that section) and
      # `config-nav-invalid-<tab>` (validation errors in it), one pair per
      # `config-tab-<tab>` below. The fixed selectors are listed here.
      - config-shell
      # FM-117 (ADR-0036): the tab body, which is the `Paper` the config
      # fields now sit on -- the same ground the dialogs already used.
      - config-tab-body
      - config-nav
      - config-nav-open
      - config-save-bar
      - config-dirty-summary
      - config-discard
      - config-tab-main
      - config-tab-auth
      - config-tab-searching
      - config-tab-categories
      - config-tab-downloading
      - config-tab-externalTools
      - config-tab-indexers
      - config-tab-notifications
      - config-tab-placeholder
      - config-advanced-toggle
      - config-api-help
      - config-save
      # FM-101 is the authority for the two validation ids below: they are
      # re-homed from the acknowledge dialogs they used to name onto the
      # persistent banners that replaced them, keeping the ids because the
      # thing they identify -- "where the server's validation errors are" and
      # "where its warnings are" -- is unchanged. Each entry of the
      # client-side invalid list additionally carries
      # `config-invalid-field-<path with dots as dashes>`, the same stem as the
      # `config-setting-<path>` row it navigates to.
      - config-validation-errors
      - config-validation-warnings
      - config-invalid-field-main-host
      - config-invalid-field-main-urlBase
      - config-restart-required
      - config-unsaved-changes
      - config-api-help-dialog
      - restart-progress-dialog
      - restart-progress-message
      # FM-099: the settings search in the sticky bar. `config-search` is the
      # input itself (not the Autocomplete root), so it can be filled and
      # tabbed to directly. Each option in the grouped listbox carries
      # `config-search-option-<path with dots as dashes>` -- the same stem as
      # the `config-setting-<path>` row it navigates to, so a selector for a
      # result can be predicted from the setting's own selector.
      - config-search
      - config-search-option-main-urlBase
      - config-search-option-searching-coverSize
      # FM-100: the review-changes panel behind the (now clickable) dirty
      # summary. Each row carries `config-review-entry-<id>`, where the id is
      # the setting's own path for a setting row -- the same stem as its
      # `config-setting-<path>` row -- and `<list path>.<entry name>` for a
      # list-section entry, with every non-alphanumeric run collapsed to a
      # dash. `config-review-empty` replaces the table when every dirty path
      # turned out to hold its original value.
      - config-review-changes
      - config-review-close
      - config-review-save
      - config-review-empty
      - config-review-entry-main-apiKey
      - config-review-entry-main-updateAutomatically
      - config-review-entry-indexers-Mock1
      # FM-102 / ADR-0028: the "on this page" list of the active tab's
      # mounted fieldsets, a sibling below the nav's `Tabs` (never a `Tabs`
      # child), headed with the active tab's name. Each entry carries
      # `config-nav-anchor-<fieldset label lowercased>` -- the same suffix as
      # `config-fieldset-<label>`, but a distinct prefix so a role/text
      # locator in a per-tab spec cannot match both a legend and its anchor.
      - config-nav-anchor-hosting
      - config-nav-anchor-logging
    parity: done
    gaps: []
  - id: F-CONFIG-MAIN
    name: Main hosting, proxy, UI, security, logging, backup, update, history, database, and runtime settings
    routes:
      - /config/main
    legacy_sources:
      - core/ui-src/js/config/config-fields-service.js
      - core/ui-src/js/config/formly-config.js
      - core/ui-src/js/file-selection-service.js
    target: core/ui-react/src/features/config/main
    tests:
      - tests/system/tests/config-main.spec.ts
      - tests/system/tests/external-tools.spec.ts
      - core/ui-react/src/features/config/main/MainConfigTab.test.tsx
      - core/ui-react/src/features/config/components/configFields.test.tsx
    selectors:
      # Legacy config markup carries no stable selectors, so these are new. Every
      # setting derives its selectors from its config path with the dots replaced
      # by dashes (`main.logging.logGc` -> `main-logging-logGc`), so a selector is
      # predictable from `config-fields-service.js` without a lookup table:
      # `config-setting-<path>` (row), `config-input-<path>` (control),
      # `config-error-<path>` (validation message), `config-tooltip-<path>`,
      # `config-secret-reveal-<path>`, `config-apikey-generate-<path>`, and
      # `config-file-browse-<path>`. FM-098 adds two more of the same kind:
      # `config-advanced-chip-<path>` on an advanced row revealed through its
      # fieldset's expander (ADR-0027 -- absent in the toggle-on state), and
      # `config-advanced-expander-<fieldset label lowercased>` -- the same
      # suffix as `config-fieldset-<label>` -- for the expander a fieldset
      # shows for the advanced rows the global toggle hides from it, and for
      # the one an advanced fieldset shows in place of itself (whose own
      # `config-fieldset-<label>` exists only once it is expanded).
      # The fixed selectors are listed below.
      - config-main
      - config-fieldset-hosting
      - config-fieldset-proxy
      - config-fieldset-ui
      - config-fieldset-security
      - config-fieldset-logging
      - config-fieldset-backup
      - config-fieldset-updates
      - config-fieldset-history
      - config-fieldset-database
      - config-fieldset-other
      - config-file-browser-dialog
      - config-file-browser-path
      - config-file-browser-up
      - config-file-browser-folder
      - config-file-browser-file
      - config-file-browser-select
    parity: done
    gaps: []
