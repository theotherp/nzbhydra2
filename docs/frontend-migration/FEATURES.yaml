schema_version: 2
features:
  - id: F-PLATFORM-SHELL
    name: Application shell, navigation, footer, and permission-aware links
    routes:
      - /*
    legacy_sources:
      - core/ui-src/js/nzbhydra.js
      - core/ui-src/js/header-controller.js
      - core/ui-src/html/states/header.html
      - core/ui-src/js/directives/footer.js
    target: core/ui-react/src/app
    tests:
      - core/ui-react/src/app/AppShell.test.tsx
      - tests/system/tests/smoke.spec.ts
    selectors:
      - app-shell-logo
      - app-shell-nav
      - shell-loginout
    parity: partial
    gaps:
      - navigation
      - not migrated - the downloader-status footer (downloaderStatusFooter.js), a websocket surface (FM-081)
      - live status
      - deliberate - FM-080 reproduces `footer.js`'s content-padding compensation for the update banners it added by measuring their real rendered height rather than legacy's pixel bookkeeping, per ADR-0014
  - id: F-AUTH-LOGIN
    name: Form login, logout, password confirmation, and session refresh
    routes:
      - /login
    legacy_sources:
      - core/ui-src/js/login-controller.js
      - core/ui-src/js/hydra-auth-service.js
      - core/ui-src/html/states/login.html
    target: core/ui-react/src/features/auth
    tests:
      - core/ui-react/src/features/auth/LoginPage.test.tsx
      - core/ui-react/src/features/auth/LoginOutButton.test.tsx
      - core/ui-react/src/features/auth/session.test.ts
      - core/ui-react/src/router.test.tsx
      - core/ui-react/src/app/AppShell.test.tsx
      - tests/system/tests/smoke.spec.ts
    selectors:
      - login-username
      - login-password
      - login-submit
      - shell-loginout
    parity: partial
    gaps:
      - OpenID Connect sign-in (server-side redirects; no SPA surface)
      - deliberate - every session transition re-enters the application through a full document navigation, because the route tree, the navigation, and the affordance itself are built once from the server-rendered bootstrap (ADR-0017 keeps only the safe config reactive); legacy changed state in place
      - deliberate - legacy's post-logout toasts ("Logged out", "Logged out. Close your browser to make sure session is closed.") and its post-BASIC-challenge "Login successful!" are not shown, because the full navigation that follows discards them
      - deliberate - the anonymous affordance is not suppressed for the rest of the page's life after a logout (legacy's `event !== "loggedOut"` branch); the next page's bootstrap decides instead
      - deliberate - the user name for a BASIC challenge's `old_username` is carried across the full navigation in session storage; legacy kept it in the header controller's scope, which a navigation would have discarded
      - deliberate - a failed logout or BASIC challenge is reported as a "Logout failed!"/"Login failed!" toast; legacy left both to the global HTTP error growl the React app has no equivalent of
      - deliberate - the login form's two placeholder-only inputs carry visible MUI labels (ADR-0014)
      - logging out of a BASIC session does not end it (verified live): the browser replays the cached `Authorization` header on the full navigation that follows the logout, so the server renders an authenticated bootstrap again and the header still reads `Logout {username}`. Legacy could not end the session either, but hid the affordance in place and so at least looked logged out. Ending a BASIC session needs a decision about the unused `POST /loggedout` endpoint (session invalidation plus a fresh challenge), which FM-078 did not own.
