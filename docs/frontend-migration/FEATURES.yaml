lace every display preference is chosen, and extends this record's persisted-choices contract: `compactRows` and `highlightRecent` join `filters`, `sorting`, and the `sidebarCollapsed` key FM-039/FM-045 already persist in the same `hydra.search-results.table` localStorage payload -- two genuinely new keys, since the popover's \"Show refine sidebar\" entry is only a second entry point to the existing visibility affordance and adds no key of its own. The below-`sm` drawer's open state is deliberately still absent from the payload (see this record's own variance below). No server-backed storage is introduced and the `server-backed preferences` gap stays open and unchanged. FM-042 (ADR-0011, Option E) re-proportions the `<colgroup>` behind the sortable headers this record's `:270`-equivalent check governs (`40px / 34% / 11% / 11% / 9% / 11% / 9% / 15%` for checkbox/Title/Indexer/Category/Size/Details/Age/Actions, measured in a real browser rather than assumed) and adopts the mock's own header-label typography as the complementary lever, so every sortable header's full label now fits with `scrollWidth <= clientWidth` at 1280x800 in both sidebar states and at 1900x1000 -- re-evidenced fresh against these ratios, not inherited from the pre-FM-042 measurement the `TABLE_MIN_WIDTH = 1320` floor was calibrated to satisfy. It also moves the stacked-card/drawer breakpoint this record's mobile checks below all reference: **both `RefineSidebar.tsx`'s drawer branch and `SearchResults.tsx`'s stacked-card table branch now switch off a raw 768px query (`theme.breakpoints.down(768)`, legacy's measured 767px threshold, `core/ui-src/less/partials/tables.less:91`) rather than MUI's `sm` (600px)** -- the below-`sm` language throughout this note and the variance beneath it now means \"below 768px\"; the two branches move together from the same shared `useCompactRefineSurface()` definition, unchanged. Pending fresh human review; see the FM-045, FM-041, and FM-042 handoffs for what changed and why."
