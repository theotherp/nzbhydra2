schema_version: 1
features:
  - id: F-PLATFORM-SHELL
    name: Application shell, navigation, footer, and permission-aware links
    route_states: [ root ]
    routes: [ "/*" ]
    roles: [ anonymous, user, stats, admin ]
    legacy_sources: [ core/ui-src/js/nzbhydra.js, core/ui-src/js/header-controller.js, core/ui-src/html/states/header.html, core/ui-src/js/directives/footer.js ]
    tests: [ tests/system/tests/smoke.spec.ts ]
    selectors: [ ]
    target: core/ui-react/src/app
    parity: partial
    visual:
      applicability: applicable
      status: proposed
      note: "Re-evidenced by FM-043 under ADR-0009's accepted full-mock-fidelity redesign, which supersedes ADR-0007's legacy-grey tokens: the shell now renders the source mock's `oklch` teal palette, its self-hosted IBM Plex Sans/Mono
        typography, and its denser radii/control sizing. Every geometry check from the prior FM-035 contract is retained (only the active-nav-item color literal changed, from `#0fab4b` to the new `primary.main`), and one new state,
        `branded-typography-and-density`, was added. The record stays `proposed`; this record has never regained human acceptance since FM-035 removed the prior 2026-08-16 acceptance (still recoverable from Git history) for the
        client-side-navigation geometry change, and the palette/typography/density change now pending review is a second, larger reason the baseline needs fresh human eyes. The prior primary-green variance below is retained rather than
        deleted, superseded in place by FM-043's own note on it. Pending fresh human review; see the FM-043 handoff."
      contract:
        setup: React-selected `ui/react?redirect=/` app shell rendered under the mock-fidelity default theme (ADR-0009, superseding ADR-0007) in `tests/system/tests/smoke.spec.ts`.
        states: [ branded-app-bar-with-logo, horizontal-desktop-navigation, mobile-collapsed-navigation, current-route-nav-item-primary-indicator, nav-item-width-stable-across-active-state, branded-typography-and-density, keyboard-focus-indicator ]
        viewports: [ { name: desktop, width: 1280, height: 800 }, { name: mobile, width: 390, height: 844 } ]
        geometry_checks:
          - AppBar and page have no horizontal overflow at either viewport
          - desktop navigation region has no horizontal overflow
          - each desktop navigation item's bounding box is horizontally aligned with its neighbors rather than vertically stacked
          - "the current route's own desktop nav item (aria-current=page) has a computed border-bottom-color equal to the theme's primary.main (oklch(0.75 0.1 190))"
          - "a desktop nav item's own bounding-box width is unchanged after it transitions from active to inactive via a real client-side navigation click"
          - "the AppBar's computed font-family includes \"IBM Plex Sans\", and a FontFace with that family reports status `loaded` at both viewports, proving the vendored webfont is applied and downloaded rather than only declared"
          - "a FontFace with family \"IBM Plex Mono\" is served by the application at both viewports, so feature code can apply the mock's numeric/tabular stack"
          - "the AppBar's computed background-color (theme background.paper) differs from the page body's computed background-color (theme background.default) at both viewports"
          - "no request to fonts.googleapis.com or fonts.gstatic.com is made while the shell loads at either viewport"
          - "FM-053 (ADR-0013): a navigation ListItemButton reached by real Tab/Shift+Tab from a known start, with no pointer interaction, renders a non-empty focused/unfocused computed-style delta and the authored token `outline: 3px solid oklch(0.75 0.1 190)` at `outline-offset: -3px`, at both viewports (at mobile the nav renders inside the hamburger Drawer, opened by keyboard)"
          - "FM-053 (ADR-0013): that indicator's changed area is 726.00 px2 against its own `4(w+h)` threshold of 508.00 px2 (control box 84.00x43.00) and its full-opacity contrast against its own composited unfocused ground rgb(38,44,46) is 6.63:1, and it is neither clipped by an ancestor nor the cause of page-level horizontal overflow at either viewport"
      evidence: [ tests/system/tests/smoke.spec.ts, tests/system/tests/focus-indication.spec.ts ]
      snapshots: [ tests/system/visual-evidence/F-PLATFORM-SHELL/app-bar-desktop.png, tests/system/visual-evidence/F-PLATFORM-SHELL/app-bar-mobile.png, tests/system/visual-evidence/F-PLATFORM-SHELL/keyboard-focus-nav-item-desktop.png ]
      variances:
        - description: "MUI `primary` uses the logo-green `#0fab4b` rather than legacy's own muted-gray `@brand-primary` (`@gray-light`, ~`#7a8288`). ADR-0007's Human Decision accepted this token choice: MUI's `primary` drives materially more interactive affordances (links, focus rings, selected/active states) than legacy's own muted-gray brand color did. Concretely, this affordance is the current-route nav item's green underline/text in the AppBar's desktop nav (not the AppBar's own background: MUI's `AppBar` defaults `enableColorOnDark` to `false`, so `color=\"primary\"` on the `AppBar` itself does not render green under `palette.mode: \"dark\"`). SUPERSEDED BY FM-043: `primary.main` is no longer the logo green at all. ADR-0009's accepted decision replaced it with the source mock's teal `oklch(0.75 0.1 190)`, so the variance from legacy's muted-gray `@brand-primary` remains real but is now a variance toward the mock rather than toward the logo. The affordance it describes (the current-route nav item's colored underline and label) is unchanged; only its color is. Retained rather than deleted so the ADR-0007 decision it records stays visible in the register."
          status: proposed
        - description: "Palette variance from legacy, with no legacy equivalent: the base palette is now the mock's own `oklch` design rather than any color legacy ever shipped -- `background.default` `#1f2426`, `background.paper` `#262c2e`, `text.primary` `#d6dad9`, `text.secondary` `#9aa2a1`, `primary.main` `oklch(0.75 0.1 190)` (light/dark `oklch(0.82 0.1 190)`/`oklch(0.85 0.1 190)`), `success.main` `oklch(0.75 0.11 150)`, `warning.main` `oklch(0.76 0.1 70)`. `info.main` `#398da5` and `error.main` `#a33938` are deliberately left at ADR-0007's legacy values because the mock renders neither role, so there is no mock evidence to adopt for them. Accepted under ADR-0009 as a decision; the rendered result still needs this record's own human visual acceptance."
          status: proposed
        - description: "Typography variance from legacy, with no legacy equivalent: `typography.fontFamily` is the mock's `\"IBM Plex Sans\", system-ui, -apple-system, sans-serif`, served from this application's own build output via `@fontsource/ibm-plex-sans` weights 400/500/600/700, and a matching `\"IBM Plex Mono\", monospace` stack (weights 400/500) is exposed for numeric/tabular feature code. Legacy shipped Bootstrap's own system stack. The mock's runtime Google Fonts CDN dependency is deliberately not adopted; the smoke spec asserts no such request occurs."
          status: proposed
        - description: "FM-053 (ADR-0013) focus-indicator variance from the visual reference: the ADR-0009 source mock `uimock/NZBHydra Search.dc.html` declares `outline:none` 15 times and authors no focus-state style at all -- its only `focus` occurrences are the `onFocus`/`onFocusSearch`/`searchFocused` JS bindings, confirmed first-hand by FM-053 rather than taken on trust -- so the authored keyboard focus indicator this record now renders (`outline: 3px solid oklch(0.75 0.1 190)` at a 3px offset, or -3px where an ancestor was measured clipping an outset ring) is a deliberate divergence from that reference, adopted under ADR-0013 (accepted 2026-08-19, Option A) for WCAG 2.4.7/2.4.11 rather than for mock fidelity. Requires explicit human acceptance under ADR-0006; accepting ADR-0013 is not accepting this variance."
          status: proposed
        - description: "FM-053 (ADR-0013) second variance, geometry: this record's navigation `ListItemButton` renders the authored token at `outline-offset: -3px` (inset) rather than the application's own 3px outset literal, because an outset ring at a 3px offset was measured live as clipped by the mobile navigation `Drawer`'s own `MuiPaper-elevation16`, whose computed overflow is not `visible`, and as overlapping two neighbouring controls. The inset ring measures 726.00 px2 against a 508.00 px2 threshold at 6.63:1 (desktop) and 1644.00 px2 against 1120.00 px2 at 6.63:1 (mobile Drawer) and is not clipped at either. The same inset geometry applies to the `Tab` family on `F-STATS-SHELL`'s tab strip, where an outset ring is clipped by `MuiTabs-scroller`. Requires explicit human acceptance under ADR-0006."
          status: proposed
        - description: "Density variance from legacy, with no legacy equivalent: shell-wide, route-agnostic component defaults now follow the mock's own measured geometry -- `shape.borderRadius` 8px and `MuiButton` 8px (the mock's dominant radius, used by its primary Search button, its toolbar buttons, its nav pills, and its text inputs), `MuiButton` `textTransform: none` (the mock never uppercases a button label), `MuiOutlinedInput` 8px (the mock's text inputs), raised non-square `MuiPaper` 12px (the mock's results card), `MuiChip` 26px tall with a 7px radius (the mock's quality/type pills: 12px label, 5px vertical padding, 1px border), and a `::-webkit-scrollbar` treatment matching the mock's 11px thin scrollbar with a 6px-radius `#3a4446` thumb on the page background. Feature-scoped density (results table cells, sidebar controls) is deliberately not touched here; it belongs to the later ADR-0009 packets."
          status: proposed
    gaps: [ navigation, footer, permission-aware links, live status ]
    task: FM-004
    backlog: { status: deferred, rationale: "Remaining shell parity needs a dedicated follow-up task after the current review queue. FM-052 (measurement only) found this record's own `theme.ts` `:focus-visible` outline (`core/ui-react/src/app/theme.ts:184-187`) is defeated, undefeated, or partially defeated depending on which of several MUI mechanisms a control uses (ButtonBase's unconditional `outline:0`, InputBase's `.MuiInputBase-input:focus{outline:0}`, MenuItem/ListItemButton's low-contrast `&.Mui-focusVisible` background, or nothing at all for `disableRipple`d controls). Two families do render the global rule as authored, so it is the precedence that is broken rather than the rule: MUI `Link` taking its default `component=\"a\"` (`stats-identifier-link`, undefeated, 7.34:1 contrast and 912.00 px2 against a 536.00 px2 threshold -- the audit's only class meeting both WCAG criteria under its primary reading), and the bare unclassed `<a href>` in NewsPage's sanitized third-party content (also undefeated, failing only because `currentColor` there is the UA default link blue, 1.29:1). An earlier version of this rationale asserted that no family renders the rule as authored; that clause predated the correction pass which added the `Link` finding and is withdrawn. The decision FM-052 raised as `ADR REQUIRED` is now made: ADR-0013 (`decisions/ADR-0013-application-wide-keyboard-focus-indication.md`, accepted 2026-08-19, Option A) adopts an explicit focus-ring token authored per control family, keyed to each component's own `&.Mui-focusVisible`/`:focus-visible` selector in `theme.ts`. FM-053 implements exactly that decision and is why the app-wide focus `gap` phrase above is removed rather than narrowed: `theme.ts` now authors one shared token (`outline: 3px solid palette.primary.main`, offset 3px outset or -3px inset where an ancestor was measured clipping it) on eleven control families, the pre-existing global `MuiCssBaseline` `:focus-visible` rule is reconciled with that same token rather than left beside it, and every family is measured live at full opacity against WCAG 2.4.7/2.4.11 and gated by `tests/system/tests/focus-indication.spec.ts` plus the `npm run validate:focus-affordances` source guard. What remains outstanding on this record is the ADR-0006 acceptance of the resulting focused state and its variances, which belongs to the repository owner alone and which no agent may supply." }

