      - deliberate - the two bulk-recheck actions are two buttons side by side; legacy hides "for all indexers" inside a split button's dropdown (recheck-all-caps.html)
      - deliberate - a bulk recheck merges only updateIndexerModel's nine fields into each matching entry and requires a non-empty name on both sides, so a nameless entry can never absorb a result
      - deliberate - a failed bulk recheck shows an acknowledgement; legacy has no rejection handler there and fell through to RequestsErrorHandler's generic error modal
      - deliberate - the import dialog asks only for host and API key; legacy's IMPORT_CONFIG box also rendered username, schedule, preselect, colour, groups, VIP expiry, and categories, none of which the importers read
      - deliberate - an import's counts and a bulk check's outcome are reported in one acknowledgement dialog rather than as consecutive growls, because C-TOAST-SERVICE shows one toast at a time and the later lines would replace the earlier ones
      - deliberate - the import dialog states before it runs that the response replaces the whole list; legacy said nothing and the admin discovered it afterwards
      - deliberate - a failed import falls back to the transport's status-derived message where legacy used the response's statusText, which ApiTransport does not carry; a request with no HTTP response still reaches legacy's "Unknown error occurred"
      - deliberate - "Add it, but disabled" on a failed connection check sets state DISABLED_USER; legacy sets model.enabled = false, a field IndexerConfig does not have, so the button did nothing there
      - deliberate - an empty "Hit reset time" is valid; legacy's timeOfDay validator rejects the empty value its own help text recommends for a rolling counter
      - deliberate - a successful capability check writes back only updateIndexerModel's nine fields, not the server's whole IndexerConfig, because the response carries credentials resolved from the ***UNCHANGED*** markers
      - deliberate - name uniqueness is checked against the other indexers; legacy's expression compares the typed value with the two-way-bound model, so renaming an existing indexer onto another's name was never rejected
      - deliberate - a picked preset's `info` prose is passed to the dialog rather than merged into the entry; legacy extends the model with it and writes an `info` key the backend has no field for into the saved config
