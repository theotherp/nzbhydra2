      - notification-toast
    parity: done
    gaps:
      - deliberate - the welcome dialog's "migrate your data" link to the NZBHydra 1 (python) migration wizard; the link fires MigrationService.migrate, whose /internalapi/migration/* calls have no backend mapping (same reachability ruling as F-SYSTEM-CONTROL's migrate button), so there is no reachable behavior to reproduce
      - deliberate - the announcements are shown one at a time in a fixed order and the sequence waits for each one to be closed; legacy opened its modals from independent, concurrent callbacks, so several could stack on top of
        each other in an order decided by response timing
      - deliberate - a one-shot acknowledgement (API-NEWS-SAVE-SHOWN, API-UPDATES-ACK-WRAPPER, and every stored flag cleared through C-SERVER-PREFERENCES) is sent only after its dialog was closed; legacy sent the news
        acknowledgement while opening the dialog and cleared each stored flag without waiting for the warning to be seen
      - deliberate - closing a user news notice dismisses it (API-USER-NEWS-DISMISS) however it was closed; legacy dismissed only on its OK button, so an escape- or backdrop-closed notice came back on the next load
      - deliberate - a stored flag counts as raised only for a value that means true; legacy's `response.data !== "" && response.data` also accepted the string "false" that its own clearing write left behind, which made every
        cleared warning reappear on every load
      - deliberate - FAILED_BACKUP shows the stored record's message and time and then clears it; legacy's display condition (`response.data && !response.data`) is unsatisfiable dead code, so the warning could never appear
      - "deliberate - the dialogs are feature-owned bodies rendered as MUI dialogs rather than C-DIALOG-SERVICE confirmations, because each one carries structure C-DIALOG-SERVICE's plain-text message cannot hold: real anchors
        for the links legacy injected as HTML, sanitized server-authored news, and the wrapper warning's file lists"
      - deliberate - FM-080's footer banners compensate the main content area's bottom padding by measuring their own rendered height (a `ResizeObserver`, with an initial synchronous measurement), rather than reproducing legacy's
        `footer.js` pixel bookkeeping (`updateFooterBottom`/`updatePaddingBottom`), per ADR-0014
      - deliberate - FM-080's "Ignore this update" only hides the banner for the current app load (no refetch); the ignored version is still recorded server-side through API-UPDATES-IGNORE, matching legacy's own scope
      - deliberate - FM-081 turns every newline in a notification body into a line break and renders it as text; legacy's body.replace("\n", "<br>") replaced only the first newline and injected the result as growl HTML
      - deliberate - FM-081's rate graph really stops self-advancing once the window holds nothing but the last known rate; legacy's _.every compared its {x, y} point objects to a number, so that stop condition could never fire
        and the interval ran until new data arrived
      - deliberate - FM-081's rate graph is a themed @mui/x-charts sparkline hidden from assistive technology (ADR-0021), without legacy's nvd3 hover tooltip; the rate, remaining time, and queue text beside it are the accessible
        surface
      - deliberate - FM-081's downloader footer and FM-080's update banners stack by measuring their own rendered heights; legacy's footer.js moved the update footer with hardcoded 20/38 pixel offsets and padded the page with
        fixed padding-bottom-N classes
      - deliberate - FM-081's state indicator is a MUI icon carrying the state as its accessible name as well as its tooltip; legacy rendered a bare glyphicon whose state was reachable only by hovering
      - deliberate - FM-085 replaced FM-081's one-connection-per-subscription behavior with a single shared SockJS/STOMP client per base URL, pooled module-scoped across every subscriber (C-LIVE-TRANSPORT, API-LIVE-SOCKJS note); an idle admin session now opens one server websocket session instead of one per live subscription
