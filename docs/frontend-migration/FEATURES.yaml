    parity: partial
    visual:
      applicability: applicable
      status: proposed
      note: "Supersedes the FM-039/FM-040 note (removed here; still recoverable from Git history), which itself superseded the prior 2026-08-16 human acceptance. FM-034's 1700px page container remains true and unchanged, as does FM-040's bulk-actions bar inside the same `results-toolbar` region; the `.result-*` column ratios do **not** remain unchanged -- see the FM-042 paragraph below, which supersedes that specific clause. FM-045 changes this record in two ways: the table header row no longer carries FM-034's inline per-column filter controls (only the sort button/indicator remains, and the header cells' vertical padding drops from MUI's 16px default to the body cells' 6px, so the header row is measurably shorter), and the toolbar's mobile-only `results-filters`/`results-quick-filters` rows are gone because the `refine-sidebar` is now the sole filter surface at every viewport (see `F-SEARCH-SORT-FILTER` for that contract, including its below-`sm` drawer). No result row, cell, summary, or selection behavior changed. FM-046 restyles the `results-toolbar` container itself from an elevated `Paper` (border/shadow) to the mock's flat, borderless bar at its own `16px 0 14px` padding, and adds a `· N selected` fragment to `search-results-summary` in `primary.main` once something is selected -- a pure density/palette and additive-text change with no change to the summary's existing loaded/filtered/available/rejected wording, no result row/cell behavior change, and no change to `results-selected-count`, which keeps rendering separately inside `results-bulk-actions` exactly as FM-040 left it. FM-041 adds two opt-in row treatments driven from the new `display-options` popover: `Compact rows` moves every body cell's vertical padding from `6px` to `4px` and tightens the row's own checkbox/action/expand controls proportionally, and `Highlight recent` flags a result at most three days old (computed from the existing `epoch` through `resultTable.ts`'s `ageInDays`; a result with no `epoch` is never flagged) with two independent properties -- an accent-teal (`primary.light`) age-column text color plus a left-edge inset accent stripe on the row's first cell -- so the flag does not depend on hue alone. Both default **off**, so the default row density, the default row rendering, and every default-state geometry check above are unchanged; the mock defaults `highlightRecent` on and that is deliberately not adopted, because changing the default rendering would invalidate accepted default-state baselines only a human may re-accept. `ResultRow`'s FM-034 memoization is untouched: the recency flag reaches it as one already-resolved boolean primitive and the density is one descendant `sx` rule on the `Table`, not a per-row prop. FM-042 (ADR-0011, Option E) makes the results table never scroll horizontally, matching legacy: the `overflowX: \"auto\"` wrapper and its `TABLE_MIN_WIDTH` floor are deleted outright, so a sticky `<th>` finally has no scrolling ancestor between it and the document and the mock's `position:sticky` toolbar/header can now both pin for real, evidenced by scrolling in `tests/system/tests/results.spec.ts`. Disclosed precisely, because it is easy to state backwards: the removed floor is what forced the byte-for-byte-ported `.result-*` ratios (54/9/8/7/6.5/5.5/10) to give -- they demonstrably do not fit once the table can be compressed below the old measured 1320px floor -- so this task adopts legacy's *fluid, never-scrolling* table model while deliberately diverging from legacy's *column ratios*, re-proportioning the `<colgroup>` to `40px / 34% / 11% / 11% / 9% / 11% / 9% / 15%` (checkbox, Title, Indexer, Category, Size, Details, Age, Actions) and adopting the mock's own header-label typography (11px/600/0.5px letter-spacing/uppercase, `#7c8483`) as the complementary lever, measured in a real browser at 1280x800 in both sidebar states and at 1900x1000 rather than implemented from ADR-0011's unmeasured sketch. The title cell gains `overflow-wrap: anywhere` (legacy's `.text-break`) so an over-long, dot-separated release name wraps across multiple lines instead of ellipsizing or spilling; variable row heights are the accepted cost. The sticky header's bottom edge is drawn as a `box-shadow` on each `<th>` rather than relying on the collapsed table's own border (which does not travel with a sticky cell), leaving `border-collapse: collapse` and FM-041's inset recency stripe both untouched. The stacked-card breakpoint moves from MUI's `sm` (600px) to a raw 768px query (legacy's measured 767px stacking threshold), shared with `F-SEARCH-SORT-FILTER`'s `refine-sidebar` drawer breakpoint via `RefineSidebar.tsx`'s `useCompactRefineSurface()`, so the two move together. Two ADR-0006 variances below are newly required by this change. Pending fresh human review; see the FM-045, FM-046, FM-041, and FM-042 handoffs for what changed and why."
      contract:
        setup: "React-selected `ui/react?redirect=/` with a deterministic mocked `internalapi/search` response (two same-title/hash NZB duplicates plus one distinct-title NZB release) submitted through the real search form, in `tests/system/tests/results.spec.ts`. The display-options/density/recency states use that spec's own separate fixture in the same file: four distinct-title NZB releases, three inside the three-day recency window and one deliberately 40 days old, so the recency distinction is assertable."
        states: [ populated-toolbar-and-table, title-dominant-column, filtered-result-narrowing, simplified-sortable-header, refine-sidebar-expanded, refine-sidebar-collapsed, refine-sidebar-mobile-drawer, refine-counts-and-type-chips, no-selection-disabled-actions, partial-selection-indeterminate, all-selected-bulk-actions, toolbar-mock-density, display-menu-open, compact-rows-enabled, recent-highlight-enabled, sidebar-shortcut-toggled, scrolled-sticky-toolbar-and-header, scrolled-popover-above-sticky, fluid-table-title-collapse, keyboard-focus-indicator ]
