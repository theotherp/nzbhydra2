  - { id: API-DOWNLOAD-ADD-NZBS, method: PUT, path: /internalapi/downloader/addNzbs, auth: download, legacy_callers: [ core/ui-src/js/nzb-download-service.js ], target: core/ui-react/src/domain/downloads/actions.ts, contract_state: generated_weak_validated, test: core/ui-react/src/domain/downloads/actions.test.ts; core/ui-react/src/features/search/results/SearchResults.test.tsx; tests/system/tests/downloads.spec.ts, note: "FM-128: `addedIds`/`missedIds` are `Collection<Long>` server-side (`AddNzbsResponse.java:23`, `SaveOrSendResultsResponse.java:22`, `FileZipResponse.java:22`) and those ids are 64-bit search-result hashes -- a live one is `-4934754469460477069`. A safe-integer bound therefore rejects real responses: Zod 4's `.int()` validates against `Number.MAX_SAFE_INTEGER`, so until FM-128 every *successful* call to this endpoint failed client-side validation and surfaced as \"Unable to complete the download action.\". `actions.ts` now checks integrality without the range bound. Note that `JSON.parse` has already rounded these ids to the nearest double by the time any client code sees them; matching against a result's own id holds only because `SearchResults.tsx:942` rounds the same way, symmetrically. Re-typing them as strings end to end would need the server to send them as strings." }
