  - { id: API-SEARCH-EXECUTE, method: POST, path: /internalapi/search, auth: search, legacy_callers: [ core/ui-src/js/search-service.js ], target: core/ui-react/src/api/search.ts, contract_state: generated_weak_validated, test: core/ui-react/src/api/search.test.ts; core/ui-react/src/features/search/SearchPage.test.tsx; core/ui-react/src/features/search/workspace/SearchWorkspace.test.tsx; tests/system/tests/search.spec.ts; tests/system/tests/results.spec.ts; tests/system/tests/downloads.spec.ts, note: "FM-016 validates category-eligible explicit indexer URL criteria, both dropdown and checkbox selection presentations, bulk actions, and exact request payloads. FM-025 component coverage asserts the exact unselected TV title/season/episode payload and unchanged plain-search payload. FM-012 preserves valid optional hash, downloadType, showtitle, season, and episode fields for explicit grouping. FM-013 also preserves valid optional downloadId, originalCategory, and downloadedAt fields; absent or null optional metadata remains unavailable without invalidating a valid result. FM-018 validates offset, limit, processed/accepted counts, indexer continuation metadata, and duplicate-safe continuation merging without changing endpoint ownership." }
