  - { id: API-DOWNLOAD-CHECK-CONNECTION, method: POST, path: /internalapi/downloader/checkConnection, auth: admin, legacy_callers: [ core/ui-src/js/config/formly-downloaders.js ], target: core/ui-react/src/api/config/downloaderConnection.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/features/config/downloading/DownloadingConfigTab.test.tsx; tests/system/tests/config-downloading.spec.ts", note: "FM-064 adopts it for F-CONFIG-DOWNLOADING's modal transaction. The request is the unsaved DownloaderConfig; because that type is a Lombok @AllArgsConstructor, Jackson treats every field as a creator parameter, and since FM-069 (ADR-0018) gave the web mapper the `FAIL_ON_NULL_FOR_PRIMITIVES` leniency `Jackson.java` already had, a body omitting -- or explicitly nulling -- the `enabled` or `addPaused` primitives is accepted with both defaulting to false instead of being rejected with HTTP 400. Keys the type does not model (legacy's presets seed a `nzbAccessType`) are still ignored. The response is GenericResponse: a failed check is still HTTP 200 with successful=false plus a message, so only a non-2xx is legacy's untestable `checked: false` case, which carries different wording and a different confirm label." }
