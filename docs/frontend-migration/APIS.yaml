  - { id: API-CONFIG-GET, method: GET, path: /internalapi/config, auth: admin, legacy_callers: [ core/ui-src/js/config/config-service.js ], target: core/ui-react/src/api/config/config.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/api/config/schema.test.ts; core/ui-react/src/api/config/config.test.ts; tests/system/tests/config.spec.ts", note: "FM-058 adopts it through a hand-written Zod envelope whose every object schema passes unknown keys through: the generated BaseConfig is all-optional, and a strict schema would delete unmodeled sections on the next PUT." }
  - { id: API-CONFIG-PUT, method: PUT, path: /internalapi/config, auth: admin, legacy_callers: [ core/ui-src/js/config/config-service.js ], target: core/ui-react/src/api/config/config.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/api/config/schema.test.ts; core/ui-react/src/api/config/config.test.ts; core/ui-react/src/features/config/ConfigShell.test.tsx; tests/system/tests/config.spec.ts; core/src/test/java/org/nzbhydra/config/validation/ConfigSecretRoundTripTest.java", note: "Rejection is reported in ConfigValidationResult.errorMessages with HTTP 200; only newConfig from an ok result may reset the form, because the server normalizes and re-masks secrets. FM-068 makes that re-masking true: newConfig is API-CONFIG-GET's own updateAfterLoading applied to a *copy* of the saved configuration, so the save response masks exactly what a load masks -- main.proxyUsername/proxyPassword, every indexers[] and downloading.downloaders[] apiKey/username/password, and every auth.users[].password -- while the running configuration keeps its real credentials. A posted ***UNCHANGED*** marker is resolved only against the record it came from: by name for indexers and downloaders, by username for users, positionally only while the list length is unchanged. A marker that cannot be resolved that way is refused with an errorMessages entry naming the setting instead of being persisted literally, so a save can now fail for a reason the client did not cause by editing a field." }
  - { id: API-CONFIG-SAFE, method: GET, path: /internalapi/config/safe, auth: session, legacy_callers: [ core/ui-src/js/config/config-service.js ], target: "core/ui-react/src/api/config/safeConfig.ts; core/ui-react/src/app/SafeConfigProvider.tsx", contract_state: generated_weak_validated, test: "core/ui-react/src/api/config/config.test.ts; core/ui-react/src/features/config/ConfigShell.test.tsx; tests/system/tests/config.spec.ts", note: "ADR-0017: the refresh source for C-BOOTSTRAP-CONTEXT's safe configuration -- a query seeded with the bootstrap value as initialData and invalidated after every successful config save. The boundary validates only that the payload is an object; ADR-0017 changes where the value comes from, not how consumers read it." }
  - { id: API-CONFIG-RELOAD, method: GET, path: /internalapi/config/reload, auth: admin, legacy_callers: [ core/ui-src/js/config/config-service.js ], target: null, contract_state: generated_weak, test: null }
  - { id: API-CONFIG-API-HELP, method: GET, path: /internalapi/config/apiHelp, auth: admin, legacy_callers: [ core/ui-src/js/config/config-service.js ], target: core/ui-react/src/api/config/config.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/api/config/schema.test.ts; core/ui-react/src/api/config/config.test.ts; core/ui-react/src/features/config/ConfigShell.test.tsx" }
  - { id: API-CONFIG-FOLDER-LISTING, method: POST, path: /internalapi/config/folderlisting, auth: admin, legacy_callers: [ core/ui-src/js/file-selection-service.js ], target: core/ui-react/src/api/config/folderListing.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/features/config/components/configFields.test.tsx; tests/system/tests/config-main.spec.ts", note: "FM-059 adopts it for C-CONFIG-FIELDS' file/folder picker. The response is validated at the boundary because FileSystemEntry.getRoots leaves fullPath unset and omits the lists; the request is the literal DirectoryListingRequest legacy sends, with type 'file' or 'folder'." }
  - { id: API-CONFIG-CUSTOM-MAPPING-TEST, method: POST, path: /internalapi/customMapping/test, auth: admin, legacy_callers: [ core/ui-src/js/config/formly-config.js ], target: core/ui-react/src/api/config/customMappingTest.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/features/config/searching/SearchingConfigTab.test.tsx; tests/system/tests/config-searching.spec.ts", note: "FM-063 adopts it for F-CONFIG-SEARCHING's mapping dialog. The request is TestRequest ({mapping, exampleInput}); the mapping's own matchAll is what decides whole-string matching, and legacy's extra top-level matchAll was always undefined and never sent. The response is validated with Zod: TestResponse's `isMatch` field serializes as `match` (Lombok getter isMatch()), and error wins over match. A null `from` makes the handler dereference getFromPattern() outside its try and answer HTTP 500, so the dialog refuses to send that request." }
  - { id: API-CONFIG-INDEXER-CONNECTION, method: POST, path: /internalapi/indexer/checkConnection, auth: admin, legacy_callers: [ core/ui-src/js/config/formly-indexers.js ], target: core/ui-react/src/api/config/indexers.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/features/config/indexers/IndexersConfigTab.test.tsx; tests/system/tests/config-indexers.spec.ts", note: "FM-066 adopts it for F-CONFIG-INDEXERS' edit dialog. The request body is a bare, unsaved IndexerConfig; the response is GenericResponse, validated with Zod. A failed check is still HTTP 200 with successful=false plus a message, and only a transport-level failure is the third outcome legacy's handleConnectionCheckFail branches on (checked=false, a different message and a different confirm label). The posted entry keeps its ***UNCHANGED*** markers -- IndexerChecker.resolveUnchangedSensitiveFields looks the stored credential up by indexer name, so the browser never holds a real secret to run the check." }
  - { id: API-CONFIG-INDEXER-CAPS, method: POST, path: /internalapi/indexer/checkCaps, auth: admin, legacy_callers: [ core/ui-src/js/config/formly-indexers.js ], target: core/ui-react/src/api/config/indexers.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/features/config/indexers/CapsCheckDialog.test.tsx; tests/system/tests/config-indexers.spec.ts", note: "FM-066 adopts it with checkType SINGLE; FM-067 adds the bulk rechecks. The request is CapsCheckRequest {indexerConfig, checkType}; the response is a list of CheckCapsResponse, validated with Zod. It is slow by design -- eight throttled requests per indexer -- so the caller shows a blocking progress dialog and polls API-CONFIG-INDEXER-CAPS-MESSAGES meanwhile. SINGLE carries the one unsaved entry to check; ALL and INCOMPLETE carry indexerConfig null and check the *saved* indexers (IndexerChecker filters to enabled, complete newznab/torznab entries, INCOMPLETE additionally to not-yet-fully-checked ones), so an empty result list is a real answer and not an error. Only updateIndexerModel's nine fields are taken from each returned indexerConfig, matched to a configured entry by name: the server resolves the ***UNCHANGED*** markers before checking, so the response carries the real credentials." }
  - { id: API-CONFIG-INDEXER-CAPS-MESSAGES, method: GET, path: /internalapi/indexer/checkCapsMessages, auth: admin, legacy_callers: [ core/ui-src/js/config/formly-indexers.js ], target: core/ui-react/src/api/config/indexers.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/features/config/indexers/CapsCheckDialog.test.tsx; tests/system/tests/config-indexers.spec.ts", note: "FM-066 adopts it as the caps dialog's 500ms progress poll. The response is a map of indexer name to messages, cleared by each new checkCaps call, so a poll is always about the check in flight; a SINGLE check renders the lines unprefixed, while FM-067's bulk checks prefix each line with the indexer name it is keyed by, which is the only way to read a check of several indexers at once. A failed poll is ignored -- it says nothing about the check -- and the poll is cleared on every exit path (resolved, failed, dialog unmounted)." }
  - { id: API-CONFIG-INDEXER-PROWLARR, method: POST, path: /internalapi/indexer/readProwlarrConfig, auth: admin, legacy_callers: [ core/ui-src/js/config/formly-indexers.js ], target: core/ui-react/src/api/config/indexers.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/features/config/indexers/IndexersConfigTab.test.tsx; tests/system/tests/config-indexers.spec.ts", note: "FM-067 adopts it for F-CONFIG-INDEXERS' Prowlarr import. The request is ProwlarrConfigReadRequest {existingIndexers, prowlarrConfig}: existingIndexers is the *unsaved* list the config form holds, and prowlarrConfig is an IndexerConfig carrying SearchModuleType.IMPORT_CONFIG -- a marker type that exists only for this request and that ProwlarrConfigRetriever clones as the template for every indexer it returns. The response is ProwlarrConfigReadResponse, validated with Zod; newIndexersConfig is a complete replacement list (it already contains the entries the request carried, minus the Prowlarr-managed ones Prowlarr no longer knows), so it replaces the whole indexers array rather than being merged. A failure is HTTP 400 whose body carries only errorMessage, which is what the dialog shows before falling back to the status and then to legacy's 'Unknown error occurred'. Its failure is HTTP 400 with ProwlarrConfigReadResponse.errorMessage. ADR-0019 bounds it to \"Error accessing Prowlarr: \" plus WebAccessException.getShortMessage() -- response message plus \"Code: N\", never the body." }
