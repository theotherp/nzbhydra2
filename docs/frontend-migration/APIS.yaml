  - { id: API-STATS-QUERY, method: POST, path: /internalapi/stats, auth: stats, legacy_callers: [ core/ui-src/js/stats-service.js ], target: core/ui-react/src/api/stats/mainStats.ts, contract_state: generated_weak_validated, test: "core/ui-react/src/api/stats/mainStats.test.ts; core/ui-react/src/features/stats/dashboard/StatsDashboardPage.test.tsx; tests/system/tests/stats.spec.ts", note: "FM-024 adopts it for F-STATS-MAIN. All sixteen family booleans are sent explicitly on every request (built from a StatFamilySelection record that always carries every key); the response is validated with Zod per family, dropping individually malformed entries and reporting a whole malformed family rather than throwing, so one bad family cannot fail the dashboard. A held StatsResult is merged field-by-field from each response (never replaced wholesale), mirroring legacy's setStats: a family the backend skipped (its boolean sent false) comes back null/absent and leaves the previously held value untouched." }
